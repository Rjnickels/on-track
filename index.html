<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stay Green</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    transition: background 0.3s ease;
    color: white;
    display: flex;
    justify-content: center;
    padding: 20px;
    min-height: 100vh;
  }

  .container {
    width: 100%;
    max-width: 520px;
    text-align: center;
  }

  input, button {
    width: 100%;
    padding: 12px;
    margin: 6px 0;
    border: none;
    border-radius: 8px;
    font-size: 16px;
  }

  button {
    background: white;
    color: black;
    font-weight: bold;
    cursor: pointer;
  }

  /* tabs */
  .tabs {
    display: flex;
    gap: 6px;
    margin: 10px 0;
  }

  .tabs button {
    flex: 1;
    background: rgba(255,255,255,0.2);
    color: white;
  }

  .tabs button.active {
    background: white;
    color: black;
  }

  /* panel */
  .panel {
    background: rgba(255,255,255,0.12);
    padding: 14px;
    border-radius: 10px;
    margin: 10px 0;
  }

  .big {
    font-size: 22px;
    font-weight: bold;
  }

  .sub {
    font-size: 14px;
    opacity: 0.9;
  }

  /* calendar */
  .calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-top: 15px;
  }

  .day {
    padding: 10px 0;
    border-radius: 8px;
    font-size: 12px;
    background: rgba(255,255,255,0.2);
    color: black;
    cursor: pointer;
  }

  .green { background: #1f8f4a; color: white; }
  .red { background: #c0392b; color: white; }
  .future { background: rgba(255,255,255,0.35); color: black; }

  .selectedBox {
    margin-top: 12px;
    font-size: 14px;
    background: rgba(255,255,255,0.12);
    padding: 10px;
    border-radius: 8px;
  }
</style>
</head>

<body>

<div class="container">
  <h1>Stay Green</h1>

  <input id="budget" type="number" placeholder="Monthly disposable income (£)" />

  <input id="spend" type="number" placeholder="Enter spend (£)" />
  <button onclick="addSpend()">Add Spend</button>
  <button onclick="undoLast()">Undo Last</button>
  <button onclick="resetApp()">Reset Month</button>

  <!-- 🔘 TABS -->
  <div class="tabs">
    <button onclick="setView('day')" id="tab-day" class="active">Day</button>
    <button onclick="setView('week')" id="tab-week">Week</button>
    <button onclick="setView('month')" id="tab-month">Month</button>
  </div>

  <!-- 💰 PANEL -->
  <div class="panel">
    <div class="big" id="safeText">—</div>
    <div class="sub" id="periodText">—</div>
    <div class="sub" id="breakdownText">—</div>
  </div>

  <!-- 📅 CALENDAR -->
  <div class="calendar" id="calendar"></div>

  <div class="selectedBox" id="selectedDay">
    Click a day to see details
  </div>
</div>

<script>

let view = "day";

function monthKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()}`;
}

function getData() {
  return JSON.parse(localStorage.getItem(monthKey())) || {
    budget: 0,
    history: []
  };
}

function saveData(data) {
  localStorage.setItem(monthKey(), JSON.stringify(data));
}

// budget
document.getElementById("budget").addEventListener("change", (e) => {
  const data = getData();
  data.budget = parseFloat(e.target.value);
  saveData(data);
  updateUI();
});

// spend
function addSpend() {
  const val = parseFloat(document.getElementById("spend").value);
  if (isNaN(val)) return;

  const data = getData();
  const today = new Date().getDate();

  data.history.push({ amount: val, day: today });

  saveData(data);
  document.getElementById("spend").value = "";
  updateUI();
}

// undo
function undoLast() {
  const data = getData();
  data.history.pop();
  saveData(data);
  updateUI();
}

// reset
function resetApp() {
  localStorage.removeItem(monthKey());
  location.reload();
}

// toggle view
function setView(v) {
  view = v;

  document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
  document.getElementById("tab-" + v).classList.add("active");

  updateUI();
}

// helpers
function getDaySpend(data, day) {
  return data.history
    .filter(h => h.day === day)
    .reduce((s, h) => s + h.amount, 0);
}

// panel logic
function updatePanel(data) {
  const now = new Date();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();

  const totalSpent = data.history.reduce((s,h)=>s+h.amount,0);

  let allowed = 0;
  let label = "";

  if (view === "day") {
    allowed = data.budget / daysInMonth;
    label = "Today";
  }

  if (view === "week") {
    allowed = (data.budget / daysInMonth) * 7;
    label = "This Week";
  }

  if (view === "month") {
    allowed = data.budget;
    label = "This Month";
  }

  const remaining = allowed - totalSpent;

  document.getElementById("safeText").innerHTML =
    remaining >= 0
      ? `Safe to spend £${remaining.toFixed(2)}`
      : `Over by £${Math.abs(remaining).toFixed(2)}`;

  document.getElementById("periodText").innerHTML = label;

  document.getElementById("breakdownText").innerHTML = `
    Budget: £${data.budget || 0}<br>
    Spent: £${totalSpent.toFixed(2)}<br>
    Allowed: £${allowed.toFixed(2)}
  `;
}

// calendar
function renderCalendar(data) {
  const el = document.getElementById("calendar");
  el.innerHTML = "";

  const now = new Date();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const today = now.getDate();

  const dailyBudget = data.budget / daysInMonth;

  for (let d = 1; d <= daysInMonth; d++) {

    const spend = getDaySpend(data, d);

    let cls = "day";

    if (d > today) cls += " future";
    else if (spend <= dailyBudget) cls += " green";
    else cls += " red";

    const div = document.createElement("div");
    div.className = cls;
    div.innerText = d;

    div.onclick = () => {
      document.getElementById("selectedDay").innerHTML = `
        <b>Day ${d}</b><br>
        Spent: £${spend.toFixed(2)}<br>
        Budget: £${dailyBudget.toFixed(2)}
      `;
    };

    el.appendChild(div);
  }
}

// main
function updateUI() {
  const data = getData();

  const now = new Date();
  const todaySpend = getDaySpend(data, now.getDate());
  const dailyBudget = data.budget / new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();

  document.body.style.background =
    todaySpend <= dailyBudget ? "#1f8f4a" : "#c0392b";

  updatePanel(data);
  renderCalendar(data);
}

updateUI();

</script>

</body>
</html>
