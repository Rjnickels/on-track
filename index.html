<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stay Green</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    transition: background 0.3s ease;
    color: white;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }

  .container {
    text-align: center;
    width: 100%;
    max-width: 520px;
  }

  input, button {
    width: 100%;
    padding: 12px;
    margin: 6px 0;
    border: none;
    border-radius: 8px;
    font-size: 16px;
  }

  button {
    background: white;
    color: black;
    font-weight: bold;
    cursor: pointer;
  }

  .big {
    font-size: 42px;
    margin: 10px 0;
  }

  .money {
    font-size: 18px;
    margin: 10px 0;
  }

  .calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-top: 15px;
  }

  .day {
    padding: 10px 0;
    border-radius: 8px;
    font-size: 12px;
    background: rgba(255,255,255,0.15);
  }

  .green { background: #1f8f4a; }
  .red { background: #c0392b; }
  .future { background: rgba(255,255,255,0.1); }

  .small {
    font-size: 13px;
    opacity: 0.9;
    margin-top: 10px;
  }
</style>
</head>

<body>

<div class="container">
  <h1>Stay Green</h1>

  <input id="budget" type="number" placeholder="Monthly disposable income (£)" />

  <input id="customSpend" type="number" placeholder="Enter spend (£)" />
  <button onclick="addSpend()">Add Spend</button>
  <button onclick="undoLast()">Undo Last Spend</button>
  <button onclick="resetApp()">Reset Month</button>

  <div class="big" id="status">—</div>
  <div class="money" id="remaining">—</div>

  <div class="small">Monthly Calendar</div>
  <div class="calendar" id="calendar"></div>
</div>

<script>

function monthKey(date = new Date()) {
  return `${date.getFullYear()}-${date.getMonth()}`;
}

function getData() {
  const key = monthKey();
  return JSON.parse(localStorage.getItem(key)) || {
    budget: 0,
    spent: 0,
    history: []
  };
}

function saveData(data) {
  localStorage.setItem(monthKey(), JSON.stringify(data));
}

// --- BUDGET ---
document.getElementById("budget").addEventListener("change", (e) => {
  const data = getData();
  data.budget = parseFloat(e.target.value);
  saveData(data);
  updateUI();
});

// --- SPEND ---
function addSpend() {
  const val = parseFloat(document.getElementById("customSpend").value);
  if (isNaN(val)) return;

  const data = getData();

  const now = new Date();
  const day = now.getDate();

  data.spent += val;

  // store by day
  if (!data.history) data.history = [];

  data.history.push({
    amount: val,
    day: day
  });

  saveData(data);

  document.getElementById("customSpend").value = "";
  updateUI();
}

// --- UNDO ---
function undoLast() {
  const data = getData();
  const last = data.history.pop();

  if (!last) return;

  data.spent -= last.amount;
  if (data.spent < 0) data.spent = 0;

  saveData(data);
  updateUI();
}

// --- RESET ---
function resetApp() {
  localStorage.removeItem(monthKey());
  location.reload();
}

// --- CALENDAR ---
function renderCalendar(data) {
  const container = document.getElementById("calendar");
  container.innerHTML = "";

  const now = new Date();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const today = now.getDate();

  for (let i = 1; i <= daysInMonth; i++) {

    const daySpend = data.history
      .filter(h => h.day === i)
      .reduce((sum, h) => sum + h.amount, 0);

    const expected = data.budget / daysInMonth;

    let cls = "day";

    if (i > today) cls += " future";
    else if (daySpend <= expected) cls += " green";
    else cls += " red";

    const el = document.createElement("div");
    el.className = cls;
    el.innerText = i;

    container.appendChild(el);
  }
}

// --- UI ---
function updateUI() {
  const data = getData();
  const now = new Date();

  const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const expected = data.budget;

  const remaining = expected - data.spent;

  const status = document.getElementById("status");
  const remainingEl = document.getElementById("remaining");

  if (remaining >= 0) {
    document.body.style.background = "#1f8f4a";
    status.innerHTML = "🟢 GREEN";
    remainingEl.innerHTML = `Safe to spend £${remaining.toFixed(2)}`;
  } else {
    document.body.style.background = "#c0392b";
    status.innerHTML = "🔴 RED";
    remainingEl.innerHTML = `Over by £${Math.abs(remaining).toFixed(2)}`;
  }

  renderCalendar(data);
}

updateUI();

</script>

</body>
</html>
