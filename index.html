<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stay Green</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    transition: background 0.3s ease;
    color: white;
    display: flex;
    justify-content: center;
    padding: 20px;
    min-height: 100vh;
  }

  .container {
    width: 100%;
    max-width: 560px;
    text-align: center;
  }

  input, button {
    width: 100%;
    padding: 12px;
    margin: 6px 0;
    border: none;
    border-radius: 8px;
    font-size: 16px;
  }

  button {
    background: white;
    color: black;
    font-weight: bold;
    cursor: pointer;
  }

  .tabs {
    display: flex;
    gap: 6px;
    margin: 10px 0;
  }

  .tabs button {
    flex: 1;
    background: rgba(255,255,255,0.2);
    color: white;
  }

  .tabs button.active {
    background: white;
    color: black;
  }

  .panel {
    background: rgba(255,255,255,0.12);
    padding: 14px;
    border-radius: 10px;
    margin: 10px 0;
  }

  .big {
    font-size: 22px;
    font-weight: bold;
  }

  .sub {
    font-size: 14px;
    opacity: 0.9;
  }

  .error {
    color: #ff4d4d;
    font-size: 14px;
    margin-top: 5px;
  }

  .calendarHeader {
    margin-top: 10px;
    font-size: 14px;
    opacity: 0.9;
  }

  .selectedBox {
    margin: 10px 0;
    font-size: 14px;
    background: rgba(255,255,255,0.12);
    padding: 10px;
    border-radius: 8px;
  }

  .calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-top: 10px;
  }

  .day {
    padding: 10px 0;
    border-radius: 8px;
    font-size: 12px;
    background: rgba(255,255,255,0.2);
    color: black;
    cursor: pointer;
  }

  .green { background: #1f8f4a; color: white; }
  .red { background: #c0392b; color: white; }
  .future { background: rgba(255,255,255,0.35); color: black; }
</style>
</head>

<body>

<div class="container">
  <h1>Stay Green</h1>

  <input id="budget" type="number" placeholder="Monthly disposable income (£)" />
  <input id="spend" type="number" placeholder="Enter spend (£)" />

  <div id="error" class="error"></div>

  <button onclick="addSpend()">Add Spend</button>
  <button onclick="resetSelectedDay()">Reset Selected Day</button>
  <button onclick="resetMonth()">Reset Month</button>

  <div class="panel">
    <div class="big" id="safeText">—</div>
    <div class="sub" id="periodText">Forecast View</div>
    <div class="sub" id="breakdownText">—</div>
  </div>

  <div class="selectedBox" id="selectedDayBox">
    Click a day to see forecast impact
  </div>

  <div class="calendarHeader" id="calendarHeader"></div>
  <div class="calendar" id="calendar"></div>
</div>

<script>

let selectedDay = null;

function now() {
  return new Date();
}

function monthKey() {
  const d = now();
  return `${d.getFullYear()}-${d.getMonth()}`;
}

function getData() {
  return JSON.parse(localStorage.getItem(monthKey())) || {
    budget: 0,
    history: []
  };
}

function saveData(data) {
  localStorage.setItem(monthKey(), JSON.stringify(data));
}

// ---------------- CORE FORECAST ENGINE ----------------
function buildForecast(data) {

  const daysInMonth = new Date(
    now().getFullYear(),
    now().getMonth()+1,
    0
  ).getDate();

  const dailyBase = data.budget / daysInMonth;

  let balance = data.budget;

  const forecast = {};

  for (let d = 1; d <= daysInMonth; d++) {

    const spent = data.history
      .filter(h => h.day === d)
      .reduce((s,h)=>s+h.amount,0);

    balance = balance - spent;

    forecast[d] = balance;
  }

  return forecast;
}

// ---------------- ADD SPEND ----------------
function addSpend() {

  const errorEl = document.getElementById("error");
  errorEl.innerText = "";

  const val = parseFloat(document.getElementById("spend").value);

  if (isNaN(val)) return;

  if (!selectedDay) {
    errorEl.innerText = "Select a day first";
    return;
  }

  const data = getData();

  data.history.push({
    amount: val,
    day: selectedDay
  });

  saveData(data);

  document.getElementById("spend").value = "";
  updateUI();
}

// ---------------- RESET DAY ----------------
function resetSelectedDay() {

  if (!selectedDay) return;

  const data = getData();

  data.history = data.history.filter(h => h.day !== selectedDay);

  saveData(data);
  updateUI();
}

// ---------------- RESET MONTH ----------------
function resetMonth() {
  localStorage.removeItem(monthKey());
  location.reload();
}

// ---------------- PANEL ----------------
function updatePanel(data, forecast) {

  const today = now().getDate();

  const current = forecast[today] ?? data.budget;

  document.body.style.background =
    current >= 0 ? "#1f8f4a" : "#c0392b";

  const active = selectedDay ?? today;

  document.getElementById("safeText").innerHTML =
    current >= 0
      ? `£${current.toFixed(2)} remaining (forecast)`
      : `£${Math.abs(current).toFixed(2)} over (forecast)`;

  document.getElementById("breakdownText").innerHTML = `
    Monthly budget: £${data.budget || 0}<br>
    Today forecast balance: £${current.toFixed(2)}
  `;
}

// ---------------- CALENDAR ----------------
function renderCalendar(data, forecast) {

  const el = document.getElementById("calendar");
  el.innerHTML = "";

  const d = now();
  const year = d.getFullYear();
  const month = d.getMonth();

  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today = d.getDate();

  const monthName = d.toLocaleString('default', { month: 'long' });

  document.getElementById("calendarHeader").innerText =
    `${monthName} ${year}`;

  for (let i = 1; i <= daysInMonth; i++) {

    let cls = "day";

    const balance = forecast[i];

    if (i > today) {
      cls += " future";
    } else {
      cls += balance >= 0 ? " green" : " red";
    }

    const div = document.createElement("div");
    div.className = cls;
    div.innerText = i;

    div.onclick = () => {
      selectedDay = i;

      document.getElementById("selectedDayBox").innerHTML =
        `<b>${monthName} ${i}</b><br>Forecast updated`;

      updateUI();
    };

    el.appendChild(div);
  }
}

// ---------------- UI ----------------
function updateUI() {

  const data = getData();

  const forecast = buildForecast(data);

  updatePanel(data, forecast);
  renderCalendar(data, forecast);
}

updateUI();

</script>

</body>
</html>
