<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stay Green</title>

<style>
body{
  margin:0;
  font-family:Arial;
  transition:0.3s;
  color:white;
  display:flex;
  justify-content:center;
  padding:20px;
  min-height:100vh;
}

.container{width:100%;max-width:560px;text-align:center;}

.inputWrap{position:relative;margin:6px 0;}

.currency{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  opacity:0.6;
  color:black;
  font-weight:bold;
}

input{
  width:100%;
  padding:12px 12px 12px 28px;
  border:none;
  border-radius:8px;
  font-size:16px;
  box-sizing: border-box;
}

button{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:none;
  border-radius:8px;
  font-size:16px;
  background:white;
  color:black;
  font-weight:bold;
  cursor:pointer;
}

.btnRow{display:flex;gap:8px;}
.btnRow button{width:50%;font-size:13px;padding:10px;}

.tabs{display:flex;gap:6px;margin:10px 0;}
.tabs button{flex:1;background:rgba(255,255,255,0.2);color:white;}
.tabs button.active{background:white;color:black;}

.panel{
  background:rgba(255,255,255,0.12);
  padding:14px;
  border-radius:10px;
  margin:10px 0;
}

.big{font-size:22px;font-weight:bold;}
.sub{font-size:14px;opacity:0.9;}

.selectedBox{
  margin:10px 0;
  padding:10px;
  border-radius:8px;
  background:rgba(255,255,255,0.12);
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
  margin-top:10px;
}

.day{
  padding:10px 0;
  border-radius:8px;
  font-size:10px;
  cursor:pointer;
  white-space:pre-line;
}

.green{background:#1f8f4a;}
.red{background:#c0392b;}
.future{background:rgba(255,255,255,0.35);color:black;}
.selected{outline:2px solid white;}
</style>
</head>

<body>

<div class="container">
<h1>Stay Green</h1>

<div class="inputWrap">
<span class="currency">£</span>
<input id="budget" type="number" placeholder="Monthly budget" oninput="saveBudget()"/>
</div>

<div class="inputWrap">
<span class="currency">£</span>
<input id="spend" type="number" placeholder="Spend"/>
</div>

<button onclick="addSpend()">Add Spend</button>

<div class="btnRow">
<button onclick="resetDay()">Reset Day</button>
<button onclick="resetMonth()">Reset Month</button>
</div>

<div class="tabs">
<button onclick="setView('day')" id="dayBtn" class="active">Day</button>
<button onclick="setView('week')" id="weekBtn">Week</button>
<button onclick="setView('month')" id="monthBtn">Month</button>
</div>

<div class="panel">
<div class="big" id="mainValue">—</div>
<div class="sub" id="subValue">—</div>
</div>

<div class="selectedBox" id="selectedBox">Click a day</div>

<div class="calendar" id="calendar"></div>
</div>

<script>

/* ---------------- STATE ---------------- */

let view = "day";
let selectedDay = new Date().getDate();

/* ---------------- DATE ---------------- */

function now(){ return new Date(); }

function daysInMonth(){
  return new Date(now().getFullYear(), now().getMonth()+1, 0).getDate();
}

/* ---------------- STORAGE ---------------- */

function key(){
  const d = now();
  return `${d.getFullYear()}-${d.getMonth()}`;
}

function getData(){
  return JSON.parse(localStorage.getItem(key())) || {budget:0,history:[]};
}

function save(d){
  localStorage.setItem(key(),JSON.stringify(d));
}

function saveBudget(){
  const val = parseFloat(document.getElementById("budget").value) || 0;
  const d = getData();
  d.budget = val;
  save(d);
  render();
}

/* ---------------- CORE ENGINE ---------------- */

// Calculates what happened UP TO a specific day
function calcUpToDay(targetDay) {
  const d = getData();
  const totalBudget = d.budget || 0;

  let totalSpent = 0;
  for (let i = 1; i <= targetDay; i++) {
    totalSpent += (d.history || [])
      .filter(h => h.day === i)
      .reduce((s, h) => s + (h.amount || 0), 0);
  }

  return {
    remaining: totalBudget - totalSpent,
    spentOnThisDay: (d.history || []).filter(h => h.day === targetDay).reduce((s, h) => s + (h.amount || 0), 0)
  };
}

/* ---------------- VIEW CONTROL ---------------- */

function setView(v){
  view = v;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
  document.getElementById(v+"Btn").classList.add("active");
  render();
}

/* ---------------- ADD SPEND ---------------- */

function addSpend(){
  const val = parseFloat(document.getElementById("spend").value);
  if(isNaN(val)) return;

  const d = getData();
  d.history.push({day:selectedDay, amount:val});
  save(d);

  document.getElementById("spend").value = "";
  render();
}

/* ---------------- RESET ---------------- */

function resetDay(){
  const d = getData();
  d.history = d.history.filter(h=>h.day!==selectedDay);
  save(d);
  render();
}

function resetMonth(){
  localStorage.removeItem(key());
  location.reload();
}

/* ---------------- RENDER ---------------- */

function render(){
  const days = daysInMonth();
  const today = now().getDate();
  const d = getData();

  if(document.activeElement !== document.getElementById("budget")) {
    document.getElementById("budget").value = d.budget || "";
  }

  // --- NEW PERSPECTIVE MATH FOR THE MAIN PANEL ---
  let mainDisplayAmount = 0;
  let subValueText = "";

  // 1. Calculate base remaining from the start of yesterday to find today's fresh allowance
  const yesterdayState = calcUpToDay(selectedDay - 1);
  const daysLeftFromSelected = Math.max(1, days - selectedDay + 1);
  const dailyAllowanceForSelectedDay = yesterdayState.remaining / daysLeftFromSelected;
  
  const selectedDayActualSpend = (d.history || [])
    .filter(h => h.day === selectedDay)
    .reduce((s, h) => s + (h.amount || 0), 0);

  if (view === "day") {
    // Budget allocated for today minus what you actually spent today
    mainDisplayAmount = dailyAllowanceForSelectedDay - selectedDayActualSpend;
    subValueText = `Remaining allowance for Day ${selectedDay}`;
  } 
  else if (view === "week") {
    // Allowance for the next 7 days (or whatever is left of the month)
    const daysInWeekView = Math.min(7, daysLeftFromSelected);
    const targetEndDay = Math.min(selectedDay + daysInWeekView - 1, days);
    
    // Total spent during this week block
    let spentInWeekBlock = 0;
    for(let i = selectedDay; i <= targetEndDay; i++) {
      spentInWeekBlock += (d.history || []).filter(h => h.day === i).reduce((s, h) => s + (h.amount || 0), 0);
    }

    const totalWeekBudget = dailyAllowanceForSelectedDay * daysInWeekView;
    mainDisplayAmount = totalWeekBudget - spentInWeekBlock;
    subValueText = `Budget for Days ${selectedDay} to ${targetEndDay}`;
  } 
  else if (view === "month") {
    // True leftover cash for the whole month
    const totalMonthState = calcUpToDay(days);
    mainDisplayAmount = totalMonthState.remaining;
    subValueText = `Total remaining for the whole month`;
  }

  // Update Background & Main text
  document.body.style.background = mainDisplayAmount >= 0 ? "#1f8f4a" : "#c0392b";
  document.getElementById("mainValue").innerText =
    mainDisplayAmount >= 0
      ? `£${mainDisplayAmount.toFixed(2)} Safe`
      : `-£${Math.abs(mainDisplayAmount).toFixed(2)} Over`;

  document.getElementById("subValue").innerText = subValueText;

  // Update Selected Day Box
  const currentDayState = calcUpToDay(selectedDay);
  document.getElementById("selectedBox").innerHTML =
    `<b>Day ${selectedDay}</b><br>
     Month Rolling Bal: £${currentDayState.remaining.toFixed(2)}<br>
     Ideal Daily Limit: £${Math.max(0, dailyAllowanceForSelectedDay).toFixed(2)}`;

  // Render Calendar
  const cal = document.getElementById("calendar");
  cal.innerHTML = "";

  for(let i=1;i<=days;i++){
    const historicalYesterday = calcUpToDay(i - 1);
    const historicalDaysLeft = Math.max(1, days - i + 1);
    const historicalDailyAllowance = historicalYesterday.remaining / historicalDaysLeft;

    let cls = "day";
    if(i > today) cls += " future";
    else {
      // Did we overspend our allowance on that specific day?
      const daySpend = (d.history || []).filter(h => h.day === i).reduce((s, h) => s + (h.amount || 0), 0);
      cls += (daySpend <= historicalDailyAllowance ? " green" : " red");
    }

    if(i === selectedDay) cls += " selected";

    const div = document.createElement("div");
    div.className = cls;
    div.innerText = i + "\n£" + Math.max(0, historicalDailyAllowance).toFixed(0);

    div.onclick = ()=>{
      selectedDay = i;
      render();
    };

    cal.appendChild(div);
  }
}

render();
</script>

</body>
</html>
