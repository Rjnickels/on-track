<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stay Green</title>

<style>
  body {
    margin:0;
    font-family:Arial;
    transition:0.3s;
    color:white;
    display:flex;
    justify-content:center;
    padding:20px;
    min-height:100vh;
  }

  .container {
    width:100%;
    max-width:560px;
    text-align:center;
  }

  .inputWrap {
    position:relative;
    margin:6px 0;
  }

  .currency {
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    opacity:0.6;
    color:black;
    font-weight:bold;
  }

  input {
    width:100%;
    padding:12px 12px 12px 28px;
    border:none;
    border-radius:8px;
    font-size:16px;
  }

  button {
    width:100%;
    padding:12px;
    margin:6px 0;
    border:none;
    border-radius:8px;
    font-size:16px;
    background:white;
    color:black;
    font-weight:bold;
    cursor:pointer;
  }

  .btnRow {
    display:flex;
    gap:8px;
  }

  .btnRow button {
    width:50%;
    font-size:13px;
    padding:10px;
  }

  .panel {
    background:rgba(255,255,255,0.12);
    padding:14px;
    border-radius:10px;
    margin:10px 0;
  }

  .big {font-size:22px;font-weight:bold;}
  .sub {font-size:14px;opacity:0.9;}

  .selectedBox {
    margin:10px 0;
    padding:10px;
    border-radius:8px;
    background:rgba(255,255,255,0.12);
  }

  .calendar {
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
    margin-top:10px;
  }

  .day {
    padding:10px 0;
    border-radius:8px;
    font-size:10px;
    cursor:pointer;
    white-space:pre-line;
  }

  .green {background:#1f8f4a;}
  .red {background:#c0392b;}
  .future {background:rgba(255,255,255,0.35); color:black;}
</style>
</head>

<body>

<div class="container">
  <h1>Stay Green</h1>

  <div class="inputWrap">
    <span class="currency">£</span>
    <input id="budget" type="number" placeholder="Monthly budget"/>
  </div>

  <div class="inputWrap">
    <span class="currency">£</span>
    <input id="spend" type="number" placeholder="Spend"/>
  </div>

  <button onclick="addSpend()">Add Spend</button>

  <!-- 🔥 SIDE BY SIDE RESET BUTTONS -->
  <div class="btnRow">
    <button onclick="resetDay()">Reset Day</button>
    <button onclick="resetMonth()">Reset Month</button>
  </div>

  <div class="panel">
    <div class="big" id="mainValue">—</div>
    <div class="sub" id="subValue">Live remaining</div>
  </div>

  <div class="selectedBox" id="selectedBox">
    Click a day
  </div>

  <div class="calendar" id="calendar"></div>
</div>

<script>

let selectedDay=null;

function now(){return new Date();}

function key(){
  const d=now();
  return `${d.getFullYear()}-${d.getMonth()}`;
}

function getData(){
  return JSON.parse(localStorage.getItem(key())) || {budget:0,history:[]};
}

function save(d){
  localStorage.setItem(key(),JSON.stringify(d));
}

// ---------------- INPUT ----------------
document.getElementById("budget").addEventListener("input",(e)=>{
  const d=getData();
  d.budget=parseFloat(e.target.value)||0;
  save(d);
  render();
});

// ---------------- ADD ----------------
function addSpend(){

  const val=parseFloat(document.getElementById("spend").value);
  if(isNaN(val)) return;

  if(!selectedDay){
    alert("Select a day first");
    return;
  }

  const d=getData();
  d.history.push({amount:val,day:selectedDay});
  save(d);

  document.getElementById("spend").value="";
  render();
}

// ---------------- RESET DAY ----------------
function resetDay(){

  if(!selectedDay){
    alert("No day selected");
    return;
  }

  const d=getData();
  d.history = d.history.filter(h => h.day !== selectedDay);
  save(d);

  render();
}

// ---------------- RESET MONTH ----------------
function resetMonth(){
  localStorage.removeItem(key());
  location.reload();
}

// ---------------- ENGINE ----------------
function build(){

  const d=getData();
  const days=new Date(now().getFullYear(),now().getMonth()+1,0).getDate();

  let bal=d.budget;
  const map={};

  for(let i=1;i<=days;i++){

    const spent=d.history
      .filter(h=>h.day===i)
      .reduce((s,h)=>s+h.amount,0);

    bal-=spent;

    const daysLeft=days-i+1;

    map[i]={
      balance:bal,
      daily:bal/daysLeft
    };
  }

  return map;
}

// ---------------- RENDER ----------------
function render(){

  const d=getData();
  const map=build();
  const today=now().getDate();

  const state=map[today];

  document.body.style.background=
    state.balance>=0?"#1f8f4a":"#c0392b";

  document.getElementById("mainValue").innerText=
    `£${state.balance.toFixed(2)} remaining`;

  const cal=document.getElementById("calendar");
  cal.innerHTML="";

  const days=new Date(now().getFullYear(),now().getMonth()+1,0).getDate();

  for(let i=1;i<=days;i++){

    const s=map[i];

    let cls="day";

    if(i>today) cls+=" future";
    else cls+=(s.balance>=0?" green":" red");

    const div=document.createElement("div");
    div.className=cls;

    div.innerText=
      i+
      "\n£"+s.balance.toFixed(0)+
      "\n/day £"+s.daily.toFixed(0);

    div.onclick=()=>{
      selectedDay=i;

      document.getElementById("selectedBox").innerHTML=
        `<b>Day ${i}</b><br>
         Remaining: £${s.balance.toFixed(2)}<br>
         Safe/day: £${s.daily.toFixed(2)}`;

      render();
    };

    cal.appendChild(div);
  }
}

render();

</script>

</body>
</html>
