<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stay Green</title>

<style>
  body{
    margin:0;
    font-family:Arial;
    transition:0.3s;
    color:white;
    display:flex;
    justify-content:center;
    padding:20px;
    min-height:100vh;
  }

  .container{width:100%;max-width:560px;text-align:center;}

  .inputWrap{position:relative;margin:6px 0;}

  .currency{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    opacity:0.6;
    color:black;
    font-weight:bold;
  }

  input{
    width:100%;
    padding:12px 12px 12px 28px;
    border:none;
    border-radius:8px;
    font-size:16px;
  }

  button{
    width:100%;
    padding:12px;
    margin:6px 0;
    border:none;
    border-radius:8px;
    font-size:16px;
    background:white;
    color:black;
    font-weight:bold;
    cursor:pointer;
  }

  .btnRow{display:flex;gap:8px;}
  .btnRow button{width:50%;font-size:13px;padding:10px;}

  .tabs{display:flex;gap:6px;margin:10px 0;}
  .tabs button{flex:1;background:rgba(255,255,255,0.2);color:white;}
  .tabs button.active{background:white;color:black;}

  .panel{
    background:rgba(255,255,255,0.12);
    padding:14px;
    border-radius:10px;
    margin:10px 0;
  }

  .big{font-size:22px;font-weight:bold;}
  .sub{font-size:14px;opacity:0.9;}

  .selectedBox{
    margin:10px 0;
    padding:10px;
    border-radius:8px;
    background:rgba(255,255,255,0.12);
  }

  .calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
    margin-top:10px;
  }

  .day{
    padding:10px 0;
    border-radius:8px;
    font-size:10px;
    cursor:pointer;
    white-space:pre-line;
  }

  .green{background:#1f8f4a;}
  .red{background:#c0392b;}
  .future{background:rgba(255,255,255,0.35);color:black;}
  .selected{outline:2px solid white;}
</style>
</head>

<body>

<div class="container">
<h1>Stay Green</h1>

<div class="inputWrap">
<span class="currency">£</span>
<input id="budget" type="number" placeholder="Monthly budget"/>
</div>

<div class="inputWrap">
<span class="currency">£</span>
<input id="spend" type="number" placeholder="Spend"/>
</div>

<button onclick="addSpend()">Add Spend</button>

<div class="btnRow">
<button onclick="resetDay()">Reset Day</button>
<button onclick="resetMonth()">Reset Month</button>
</div>

<div class="tabs">
<button onclick="setView('day')" id="dayBtn" class="active">Day</button>
<button onclick="setView('week')" id="weekBtn">Week</button>
<button onclick="setView('month')" id="monthBtn">Month</button>
</div>

<div class="panel">
<div class="big" id="mainValue">—</div>
<div class="sub" id="subValue">—</div>
</div>

<div class="selectedBox" id="selectedBox">Click a day</div>

<div class="calendar" id="calendar"></div>
</div>

<script>

let view="day";
let selectedDay=null;

function now(){return new Date();}

function daysInMonth(){
  return new Date(now().getFullYear(), now().getMonth()+1, 0).getDate();
}

function key(){
  const d=now();
  return `${d.getFullYear()}-${d.getMonth()}`;
}

function getData(){
  return JSON.parse(localStorage.getItem(key())) || {budget:0,history:[]};
}

function save(d){
  localStorage.setItem(key(),JSON.stringify(d));
}

/* ---------------- INPUT ---------------- */

document.getElementById("budget").addEventListener("input",(e)=>{
  const d=getData();
  d.budget=parseFloat(e.target.value)||0;
  save(d);
  render();
});

/* ---------------- VIEW ---------------- */

function setView(v){
  view=v;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
  document.getElementById(v+"Btn").classList.add("active");
  render();
}

/* ---------------- ROLLING ENGINE ---------------- */

function getProjection(day){

  const d=getData();
  const days = daysInMonth();

  let remaining = d.budget;

  for(let i=1;i<=day;i++){
    const spent = d.history
      .filter(h=>h.day===i)
      .reduce((s,h)=>s+h.amount,0);

    remaining -= spent;
  }

  const daysLeft = days - day + 1;
  const dailySafe = remaining / daysLeft;

  return {remaining, dailySafe};
}

/* ---------------- ADD ---------------- */

function addSpend(){

  const val=parseFloat(document.getElementById("spend").value);
  if(isNaN(val)) return;

  if(!selectedDay){
    alert("Select a day first");
    return;
  }

  const d=getData();
  d.history.push({day:selectedDay, amount:val});
  save(d);

  document.getElementById("spend").value="";
  render();
}

/* ---------------- RESET ---------------- */

function resetDay(){
  if(!selectedDay) return;
  const d=getData();
  d.history = d.history.filter(h=>h.day!==selectedDay);
  save(d);
  render();
}

function resetMonth(){
  localStorage.removeItem(key());
  location.reload();
}

/* ---------------- VIEW STATE ---------------- */

function viewState(){
  const today = now().getDate();

  if(view==="day" && selectedDay){
    return getProjection(selectedDay);
  }

  if(view==="week"){
    let start = selectedDay || today;
    let end = Math.min(start+6, daysInMonth());

    let remaining = 0;

    for(let i=start;i<=end;i++){
      const p=getProjection(i);
      remaining = p.remaining;
    }

    return {remaining};
  }

  return getProjection(today);
}

/* ---------------- RENDER ---------------- */

function render(){

  const days=daysInMonth();
  const today=now().getDate();

  const state=viewState();
  const remaining = state.remaining ?? state.dailySafe ?? 0;

  document.body.style.background =
    remaining >= 0 ? "#1f8f4a" : "#c0392b";

  document.getElementById("mainValue").innerText =
    remaining >= 0
      ? `£${remaining.toFixed(2)} Safe`
      : `-£${Math.abs(remaining).toFixed(2)} Over`;

  document.getElementById("subValue").innerText =
    `View: ${view}`;

  if(selectedDay){
    const r=getProjection(selectedDay);

    document.getElementById("selectedBox").innerHTML=
      `<b>Day ${selectedDay}</b><br>
      Remaining: £${r.remaining.toFixed(2)}<br>
      Safe/day: £${r.dailySafe.toFixed(2)}`;
  }

  const cal=document.getElementById("calendar");
  cal.innerHTML="";

  for(let i=1;i<=days;i++){

    const r=getProjection(i);

    let cls="day";

    if(i>today) cls+=" future";
    else cls+=(r.remaining>=0?" green":" red");

    if(i===selectedDay) cls+=" selected";

    const div=document.createElement("div");

    div.className=cls;

    div.innerText =
      i + "\n£" + r.dailySafe.toFixed(0);

    div.onclick=()=>{
      selectedDay=i;
      render();
    };

    cal.appendChild(div);
  }
}

render();

</script>

</body>
</html>
