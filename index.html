<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GreenTrack | Stay in the Green Zone</title>

<style>
body{
  margin:0;
  font-family: 'Segoe UI', Arial, sans-serif;
  transition:0.3s;
  color:white;
  display:flex;
  justify-content:center;
  padding:20px;
  min-height:100vh;
  background:#1f8f4a; /* Dynamic fallback */
}

.container{width:100%;max-width:560px;text-align:center;}

.brand-subtitle {
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 3px;
  margin-top: -10px;
  margin-bottom: 25px;
  opacity: 0.8;
  color: #e8f5e9;
}

.inputWrap{position:relative;margin:6px 0;}

.currency{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  opacity:0.6;
  color:black;
  font-weight:bold;
}

input{
  width:100%;
  padding:12px 12px 12px 28px;
  border:none;
  border-radius:8px;
  font-size:16px;
  box-sizing: border-box;
}

button{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:none;
  border-radius:8px;
  font-size:16px;
  background:white;
  color:black;
  font-weight:bold;
  cursor:pointer;
}

.btnRow{display:flex;gap:8px;}
.btnRow button{width:50%;font-size:13px;padding:10px;}

.tabs{display:flex;gap:6px;margin:10px 0;}
.tabs button{flex:1;background:rgba(255,255,255,0.2);color:white;}
.tabs button.active{background:white;color:black;}

.panel{
  background:rgba(255,255,255,0.15);
  padding:18px;
  border-radius:10px;
  margin:10px 0;
  backdrop-filter: blur(5px);
}

.big{font-size:24px;font-weight:bold;letter-spacing: 0.5px;}

.status-indicator{
  font-size: 14px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-top: 8px;
  padding: 4px 8px;
  border-radius: 4px;
  display: inline-block;
  background: rgba(0,0,0,0.2);
}

.sub{font-size:13px;opacity:0.9;margin-top:8px;}

.selectedBox{
  margin:10px 0;
  padding:12px;
  border-radius:8px;
  background:rgba(255,255,255,0.12);
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
  margin-top:10px;
}

.day{
  padding:8px 2px;
  border-radius:8px;
  font-size:9px;
  line-height:1.3;
  cursor:pointer;
  white-space:pre-line;
}

/* GreenTrack Color Signals */
.green{background:#2e7d32;} /* Optimal Trajectory */
.red{background:#c62828;}   /* Deficit Trajectory */
.future{background:rgba(255,255,255,0.35);color:#1b5e20;}
.selected{outline:3px solid white;}
</style>
</head>

<body>

<div class="container">
<h1>GreenTrack</h1>
<div class="brand-subtitle">Pacing & Balance Engine</div>

<div class="inputWrap">
<span class="currency">£</span>
<input id="budget" type="number" placeholder="Enter target limit for this month" oninput="saveBudget()"/>
</div>

<div class="inputWrap">
<span class="currency">£</span>
<input id="spend" type="number" placeholder="Log expense amount" />
</div>

<button onclick="addSpend()">Log Transaction</button>

<div class="btnRow">
<button onclick="resetDay()">Clear Selected Day</button>
<button onclick="resetMonth()">Reset Track Cycle</button>
</div>

<div class="tabs">
<button onclick="setView('day')" id="dayBtn" class="active">Daily Track</button>
<button onclick="setView('week')" id="weekBtn">Weekly Pacing</button>
<button onclick="setView('month')" id="monthBtn">Cycle Summary</button>
</div>

<div class="panel">
<div class="big" id="mainValue">—</div>
<div id="statusIndicator" class="status-indicator">—</div>
<div class="sub" id="subValue">—</div>
</div>

<div class="selectedBox" id="selectedBox">Select calendar day below</div>

<div class="calendar" id="calendar"></div>
</div>

<script>

/* ---------------- STATE ---------------- */

let view = "day";
let selectedDay = new Date().getDate();

/* ---------------- DATE ---------------- */

function now(){ return new Date(); }

function daysInMonth(){
  return new Date(now().getFullYear(), now().getMonth()+1, 0).getDate();
}

/* ---------------- STORAGE ---------------- */

function key(){
  const d = now();
  return `${d.getFullYear()}-${d.getMonth()}`;
}

function getData(){
  try {
    return JSON.parse(localStorage.getItem(key())) || {budget:0,history:[]};
  } catch(e) {
    return {budget:0,history:[]};
  }
}

function save(d){
  localStorage.setItem(key(),JSON.stringify(d));
}

function saveBudget(){
  const val = parseFloat(document.getElementById("budget").value) || 0;
  const d = getData();
  d.budget = val;
  save(d);
  render();
}

/* ---------------- CORE ENGINE ---------------- */

function calcUpToDay(targetDay) {
  const d = getData();
  const totalBudget = d.budget || 0;

  let totalSpent = 0;
  const historyList = d.history || [];
  
  for (let i = 1; i <= targetDay; i++) {
    totalSpent += historyList
      .filter(h => h && h.day === i)
      .reduce((s, h) => s + (h.amount || 0), 0);
  }

  return {
    remaining: totalBudget - totalSpent,
    spentOnThisDay: historyList.filter(h => h && h.day === targetDay).reduce((s, h) => s + (h.amount || 0), 0)
  };
}

/* ---------------- VIEW CONTROL ---------------- */

function setView(v){
  view = v;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
  const btn = document.getElementById(v+"Btn");
  if(btn) btn.classList.add("active");
  render();
}

/* ---------------- ADD SPEND ---------------- */

function addSpend(){
  const val = parseFloat(document.getElementById("spend").value);
  if(isNaN(val)) return;

  const d = getData();
  if(!d.history) d.history = [];
  d.history.push({day:selectedDay, amount:val});
  save(d);

  document.getElementById("spend").value = "";
  render();
}

/* ---------------- RESET ---------------- */

function resetDay(){
  const d = getData();
  if(d.history) {
    d.history = d.history.filter(h => h && h.day !== selectedDay);
  }
  save(d);
  render();
}

function resetMonth(){
  localStorage.removeItem(key());
  location.reload();
}

/* ---------------- RENDER ---------------- */

function render(){
  const days = daysInMonth();
  const today = now().getDate();
  const d = getData();

  const budgetInput = document.getElementById("budget");
  if(budgetInput && document.activeElement !== budgetInput) {
    budgetInput.value = d.budget || "";
  }

  // --- PERSPECTIVE MATH FOR THE MAIN PANEL ---
  let mainDisplayAmount = 0;
  let subValueText = "";

  const yesterdayState = calcUpToDay(selectedDay - 1);
  const daysLeftFromSelected = Math.max(1, days - selectedDay + 1);
  const dailyAllowanceForSelectedDay = daysLeftFromSelected > 0 ? (yesterdayState.remaining / daysLeftFromSelected) : 0;
  
  const historyList = d.history || [];
  const selectedDayActualSpend = historyList
    .filter(h => h && h.day === selectedDay)
    .reduce((s, h) => s + (h.amount || 0), 0);

  if (view === "day") {
    mainDisplayAmount = dailyAllowanceForSelectedDay - selectedDayActualSpend;
    subValueText = `Safe margin allocation for Day ${selectedDay}`;
  } 
  else if (view === "week") {
    const daysInWeekView = Math.min(7, daysLeftFromSelected);
    const targetEndDay = Math.min(selectedDay + daysInWeekView - 1, days);
    
    let spentInWeekBlock = 0;
    for(let i = selectedDay; i <= targetEndDay; i++) {
      spentInWeekBlock += historyList.filter(h => h && h.day === i).reduce((s, h) => s + (h.amount || 0), 0);
    }

    const totalWeekBudget = dailyAllowanceForSelectedDay * daysInWeekView;
    mainDisplayAmount = totalWeekBudget - spentInWeekBlock;
    subValueText = `Combined baseline for Days ${selectedDay} to ${targetEndDay}`;
  } 
  else if (view === "month") {
    const totalMonthState = calcUpToDay(days);
    mainDisplayAmount = totalMonthState.remaining;
    subValueText = `Total remaining cycle runway`;
  }

  // Update Background & Main text
  const isOnTrack = mainDisplayAmount >= 0;
  document.body.style.background = isOnTrack ? "#2e7d32" : "#c62828";
  
  const mainValEl = document.getElementById("mainValue");
  if (mainValEl) {
    mainValEl.innerText = isOnTrack
      ? `£${mainDisplayAmount.toFixed(2)} Ahead`
      : `-£${Math.abs(mainDisplayAmount).toFixed(2)} Behind`;
  }

  // Track Status Signals
  const statusEl = document.getElementById("statusIndicator");
  if (statusEl) {
    statusEl.innerText = isOnTrack ? "✓ ON TRACK" : "⚠ OFF TRACK";
    statusEl.style.color = isOnTrack ? "#a5d6a7" : "#ef9a9a";
  }

  const subValEl = document.getElementById("subValue");
  if (subValEl) subValEl.innerText = subValueText;

  // Update Selected Day Box
  const currentDayState = calcUpToDay(selectedDay);
  const selectedBoxEl = document.getElementById("selectedBox");
  if (selectedBoxEl) {
    selectedBoxEl.innerHTML =
      `<b>Day ${selectedDay} Pacing Profile</b><br>
       Rolling Reserve Remaining: £${currentDayState.remaining.toFixed(2)}<br>
       Target Daily Limit: £${Math.max(0, dailyAllowanceForSelectedDay).toFixed(2)}`;
  }

  // --- LIVE PROJECTING CALENDAR GENERATOR ---
  const cal = document.getElementById("calendar");
  if (cal) {
    cal.innerHTML = "";

    const todayState = calcUpToDay(today);
    const futureDaysCount = Math.max(1, days - today); 
    const futureDailyAllowance = futureDaysCount > 0 ? (todayState.remaining / futureDaysCount) : 0;

    for(let i = 1; i <= days; i++){
      let cls = "day";
      let displayAllowance = 0;
      let actualSpendOnDay = 0;
      let isFuture = false;

      if (i < today) {
        const historicalYesterday = calcUpToDay(i - 1);
        const historicalDaysLeft = Math.max(1, days - i + 1);
        displayAllowance = historicalDaysLeft > 0 ? (historicalYesterday.remaining / historicalDaysLeft) : 0;
        actualSpendOnDay = historyList.filter(h => h && h.day === i).reduce((s, h) => s + (h.amount || 0), 0);
        cls += (actualSpendOnDay <= displayAllowance ? " green" : " red");
      } 
      else if (i === today) {
        const historicalYesterday = calcUpToDay(i - 1);
        const historicalDaysLeft = Math.max(1, days - i + 1);
        displayAllowance = historicalDaysLeft > 0 ? (historicalYesterday.remaining / historicalDaysLeft) : 0;
        actualSpendOnDay = historyList.filter(h => h && h.day === i).reduce((s, h) => s + (h.amount || 0), 0);
        cls += (actualSpendOnDay <= displayAllowance ? " green" : " red");
      } 
      else {
        displayAllowance = futureDailyAllowance;
        cls += " future";
        isFuture = true;
      }

      if(i === selectedDay) cls += " selected";

      const div = document.createElement("div");
      div.className = cls;
      
      // Calculate day's remaining margin (Allowance - Actual Spent)
      const dayRemainingMargin = displayAllowance - actualSpendOnDay;
      
      // Show Day #, Allowed Limit, and the accurate Day Remaining Balance
      if (!isFuture) {
        const sign = dayRemainingMargin >= 0 ? "£" : "-£";
        div.innerText = `${i}\nLmt:£${displayAllowance.toFixed(0)}\nRem:${sign}${Math.abs(dayRemainingMargin).toFixed(0)}`;
      } else {
        div.innerText = `${i}\nProj\n£${displayAllowance.toFixed(0)}`;
      }

      div.onclick = ()=>{
        selectedDay = i;
        render();
      };

      cal.appendChild(div);
    }
  }
}

try {
  render();
} catch(e) {
  console.error("Initial render failed: ", e);
}
</script>

</body>
</html>
