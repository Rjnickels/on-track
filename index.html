<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stay Green</title>

<style>
body{
  margin:0;
  font-family:Arial;
  transition:0.3s;
  color:white;
  display:flex;
  justify-content:center;
  padding:20px;
  min-height:100vh;
}

.container{width:100%;max-width:560px;text-align:center;}

.inputWrap{position:relative;margin:6px 0;}

.currency{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  opacity:0.6;
  color:black;
  font-weight:bold;
}

input{
  width:100%;
  padding:12px 12px 12px 28px;
  border:none;
  border-radius:8px;
  font-size:16px;
  box-sizing: border-box; /* Fixes input overflow */
}

button{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:none;
  border-radius:8px;
  font-size:16px;
  background:white;
  color:black;
  font-weight:bold;
  cursor:pointer;
}

.btnRow{display:flex;gap:8px;}
.btnRow button{width:50%;font-size:13px;padding:10px;}

.tabs{display:flex;gap:6px;margin:10px 0;}
.tabs button{flex:1;background:rgba(255,255,255,0.2);color:white;}
.tabs button.active{background:white;color:black;}

.panel{
  background:rgba(255,255,255,0.12);
  padding:14px;
  border-radius:10px;
  margin:10px 0;
}

.big{font-size:22px;font-weight:bold;}
.sub{font-size:14px;opacity:0.9;}

.selectedBox{
  margin:10px 0;
  padding:10px;
  border-radius:8px;
  background:rgba(255,255,255,0.12);
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
  margin-top:10px;
}

.day{
  padding:10px 0;
  border-radius:8px;
  font-size:10px;
  cursor:pointer;
  white-space:pre-line;
}

.green{background:#1f8f4a;}
.red{background:#c0392b;}
.future{background:rgba(255,255,255,0.35);color:black;}
.selected{outline:2px solid white;}
</style>
</head>

<body>

<div class="container">
<h1>Stay Green</h1>

<div class="inputWrap">
<span class="currency">£</span>
<input id="budget" type="number" placeholder="Monthly budget" oninput="saveBudget()"/>
</div>

<div class="inputWrap">
<span class="currency">£</span>
<input id="spend" type="number" placeholder="Spend"/>
</div>

<button onclick="addSpend()">Add Spend</button>

<div class="btnRow">
<button onclick="resetDay()">Reset Day</button>
<button onclick="resetMonth()">Reset Month</button>
</div>

<div class="tabs">
<button onclick="setView('day')" id="dayBtn" class="active">Day</button>
<button onclick="setView('week')" id="weekBtn">Week</button>
<button onclick="setView('month')" id="monthBtn">Month</button>
</div>

<div class="panel">
<div class="big" id="mainValue">—</div>
<div class="sub" id="subValue">—</div>
</div>

<div class="selectedBox" id="selectedBox">Click a day</div>

<div class="calendar" id="calendar"></div>
</div>

<script>

/* ---------------- STATE ---------------- */

let view = "day";
let selectedDay = new Date().getDate();

/* ---------------- DATE ---------------- */

function now(){ return new Date(); }

function daysInMonth(){
  return new Date(now().getFullYear(), now().getMonth()+1, 0).getDate();
}

/* ---------------- STORAGE ---------------- */

function key(){
  const d = now();
  return `${d.getFullYear()}-${d.getMonth()}`;
}

function getData(){
  return JSON.parse(localStorage.getItem(key())) || {budget:0,history:[]};
}

function save(d){
  localStorage.setItem(key(),JSON.stringify(d));
}

// Added function to save budget changes
function saveBudget(){
  const val = parseFloat(document.getElementById("budget").value) || 0;
  const d = getData();
  d.budget = val;
  save(d);
  render();
}

/* ---------------- CORE ENGINE ---------------- */

function calc(targetDay) {
  const d = getData();
  const days = daysInMonth();
  const totalBudget = d.budget || 0;

  // 1. Calculate TOTAL spent up to the target day
  let totalSpentUpToTarget = 0;
  for (let i = 1; i <= targetDay; i++) {
    totalSpentUpToTarget += (d.history || [])
      .filter(h => h.day === i)
      .reduce((s, h) => s + (h.amount || 0), 0);
  }

  // 2. What is left out of the total budget on that target day
  let remaining = totalBudget - totalSpentUpToTarget;

  // 3. Daily safe spend calculation
  const daysLeft = Math.max(1, days - targetDay + 1);
  let daily = remaining / daysLeft;

  return {
    remaining,
    daily
  };
}

/* ---------------- VIEW CONTROL ---------------- */

function setView(v){
  view = v;

  document.querySelectorAll(".tabs button")
    .forEach(b=>b.classList.remove("active"));

  document.getElementById(v+"Btn").classList.add("active");

  render();
}

/* ---------------- ADD SPEND ---------------- */

function addSpend(){
  const val = parseFloat(document.getElementById("spend").value);
  if(isNaN(val)) return;

  const d = getData();
  d.history.push({day:selectedDay, amount:val});
  save(d);

  document.getElementById("spend").value = "";
  render();
}

/* ---------------- RESET ---------------- */

function resetDay(){
  const d = getData();
  d.history = d.history.filter(h=>h.day!==selectedDay);
  save(d);
  render();
}

function resetMonth(){
  localStorage.removeItem(key());
  location.reload();
}

/* ---------------- TARGET LOGIC ---------------- */

function getTargetDay(){
  const days = daysInMonth();

  if(view === "day"){
    return selectedDay;
  }
  if(view === "week"){
    return Math.min(selectedDay + 6, days);
  }
  return days; // Month view looks at the end of the month
}

/* ---------------- RENDER ---------------- */

function render(){
  const days = daysInMonth();
  const today = now().getDate();
  const d = getData();

  // Keep the budget input field showing what's saved
  if(document.activeElement !== document.getElementById("budget")) {
    document.getElementById("budget").value = d.budget || "";
  }

  const target = getTargetDay();
  const state = calc(target);
  const remaining = state.remaining;

  // Update background color based on the dynamic view selection
  document.body.style.background = remaining >= 0 ? "#1f8f4a" : "#c0392b";

  // Dynamic text depending on Day/Week/Month view selection
  let viewText = "Day";
  if(view === "week") viewText = "Week (Next 7 Days)";
  if(view === "month") viewText = "Month End";

  document.getElementById("mainValue").innerText =
    remaining >= 0
      ? `£${remaining.toFixed(2)} Safe`
      : `-£${Math.abs(remaining).toFixed(2)} Over`;

  document.getElementById("subValue").innerText =
    `Target: ${viewText} (Day ${target})`;

  const sel = calc(selectedDay);

  document.getElementById("selectedBox").innerHTML =
    `<b>Day ${selectedDay}</b><br>
     Remaining: £${sel.remaining.toFixed(2)}<br>
     Safe/day: £${sel.daily.toFixed(2)}`;

  const cal = document.getElementById("calendar");
  cal.innerHTML = "";

  for(let i=1;i<=days;i++){
    const r = calc(i);
    let cls = "day";

    if(i > today) cls += " future";
    else cls += (r.remaining >= 0 ? " green" : " red");

    if(i === selectedDay) cls += " selected";

    const div = document.createElement("div");
    div.className = cls;
    div.innerText = i + "\n£" + r.daily.toFixed(0);

    div.onclick = ()=>{
      selectedDay = i;
      render();
    };

    cal.appendChild(div);
  }
}

// Initial pull on load
render();

</script>

</body>
</html>
