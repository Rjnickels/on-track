<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GreenTrack | Monthly Budget Tool</title>

<style>
:root {
  --glass: rgba(255,255,255,0.14);
  --glass-border: rgba(255,255,255,0.2);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  color: white;
  display: flex;
  justify-content: center;
  padding: 24px 16px 48px;
  min-height: 100vh;
  background: #2e7d32;
  transition: background 0.5s ease;
}

.container { width: 100%; max-width: 580px; }

.header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 4px;
}
.brand {
  font-family: 'Courier New', Courier, monospace;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -1px;
}
.month-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  font-weight: 600;
  opacity: 0.85;
}
.month-nav button {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  color: white;
  width: 28px; height: 28px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
.month-nav button:hover { background: rgba(255,255,255,0.28); }

.brand-subtitle {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 3px;
  opacity: 0.65;
  margin-bottom: 22px;
}

.input-group { position: relative; margin: 5px 0; }
.currency-symbol {
  position: absolute; left: 13px; top: 50%;
  transform: translateY(-50%);
  font-weight: 700; opacity: 0.5; color: #111;
  pointer-events: none;
  font-size: 15px;
}
input[type="number"] {
  width: 100%;
  padding: 13px 13px 13px 30px;
  border: none;
  border-radius: 9px;
  font-size: 16px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: white;
  color: #111;
  outline: none;
  transition: box-shadow 0.2s;
}
input[type="number"]:focus { box-shadow: 0 0 0 3px rgba(255,255,255,0.5); }
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }

.btn-primary {
  width: 100%; padding: 13px; margin: 6px 0;
  border: none; border-radius: 9px;
  font-size: 16px; font-weight: 600;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: white; color: #111;
  cursor: pointer;
  transition: transform 0.1s, box-shadow 0.2s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.btn-primary:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
.btn-primary:active { transform: scale(0.98); }

.btn-row { display: flex; gap: 8px; margin: 4px 0; }
.btn-row button {
  flex: 1; padding: 10px;
  border: 1px solid var(--glass-border);
  border-radius: 9px;
  font-size: 13px; font-weight: 600;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--glass); color: white;
  cursor: pointer;
  transition: background 0.2s;
}
.btn-row button:hover { background: rgba(255,255,255,0.28); }

.tabs { display: flex; gap: 6px; margin: 14px 0 8px; }
.tabs button {
  flex: 1; padding: 10px;
  border: 1px solid var(--glass-border);
  border-radius: 8px;
  font-size: 13px; font-weight: 600;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--glass); color: white;
  cursor: pointer; transition: background 0.2s, color 0.2s;
}
.tabs button.active { background: white; color: #111; border-color: white; }

.panel {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  padding: 20px;
  border-radius: 12px;
  margin: 8px 0;
  backdrop-filter: blur(6px);
  text-align: center;
}
.big {
  font-family: 'Courier New', Courier, monospace;
  font-size: 28px; font-weight: 700;
  letter-spacing: -0.5px;
}
.status-pill {
  display: inline-block;
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 2px;
  padding: 4px 10px; border-radius: 20px;
  margin-top: 8px;
  background: rgba(0,0,0,0.2);
}
.sub { font-size: 13px; opacity: 0.8; margin-top: 6px; }

.selected-box {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 10px;
  padding: 14px 16px;
  margin: 8px 0;
  font-size: 13px;
  line-height: 1.7;
}
.selected-box strong { font-family: 'Courier New', Courier, monospace; font-size: 12px; }

.log-section {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 10px;
  padding: 14px 16px;
  margin: 8px 0;
  max-height: 160px;
  overflow-y: auto;
}
.log-section h4 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 2px;
  opacity: 0.7;
  margin-bottom: 8px;
}
.log-entry {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  padding: 5px 0;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.log-entry:last-child { border-bottom: none; }
.log-entry .log-amount { font-family: 'Courier New', Courier, monospace; font-size: 12px; }
.log-delete {
  background: none; border: none; color: rgba(255,255,255,0.5);
  cursor: pointer; font-size: 16px; padding: 0 4px;
  transition: color 0.2s;
}
.log-delete:hover { color: #ef9a9a; }
.log-empty { font-size: 12px; opacity: 0.5; text-align: center; padding: 6px 0; }

.calendar-header {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-bottom: 4px;
}
.cal-day-label {
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  opacity: 0.5;
  text-align: center;
  padding: 2px 0;
}
.calendar-wrap {
  background: rgba(0,0,0,0.12);
  padding: 12px;
  border-radius: 12px;
  margin-top: 10px;
}
.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}
.day {
  padding: 8px 2px;
  border-radius: 7px;
  font-size: 9px;
  font-weight: 700;
  line-height: 1.4;
  cursor: pointer;
  white-space: pre-line;
  text-align: center;
  box-shadow: 0 1px 4px rgba(0,0,0,0.15);
  transition: transform 0.1s, box-shadow 0.15s;
  user-select: none;
}
.day:hover { transform: scale(1.06); box-shadow: 0 3px 10px rgba(0,0,0,0.25); }
.day:active { transform: scale(0.97); }
.day.green  { background: #1b5e20; color: #c8e6c9; }
.day.red    { background: #b71c1c; color: #ffcdd2; }
.day.future { background: rgba(255,255,255,0.82); color: #222; }
.day.today-ring { outline: 3px solid rgba(255,255,255,0.6); outline-offset: 1px; }
.day.selected { outline: 3px solid white; box-shadow: 0 0 12px rgba(255,255,255,0.55); }

.log-section::-webkit-scrollbar { width: 4px; }
.log-section::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }
</style>
</head>

<body>
<div class="container">

  <div class="header">
    <div><div class="brand">GreenTrack</div></div>
    <div class="month-nav">
      <button onclick="prevMonth()">&#8249;</button>
      <span id="monthLabel">—</span>
      <button onclick="nextMonth()">&#8250;</button>
    </div>
  </div>
  <div class="brand-subtitle">Monthly Budget Tool</div>

  <div class="input-group">
    <span class="currency-symbol">£</span>
    <input id="budget" type="number" min="0" placeholder="Monthly disposable income" oninput="saveBudget()"/>
  </div>

  <div class="input-group">
    <span class="currency-symbol">£</span>
    <input id="spend" type="number" min="0" placeholder="Amount spent (positive only)"/>
  </div>

  <button class="btn-primary" onclick="addSpend()">Enter Spending</button>

  <div class="btn-row">
    <button onclick="resetDay()">Clear Today's Entries</button>
    <button onclick="resetMonth()">Reset Whole Month</button>
  </div>

  <div class="tabs">
    <button onclick="setView('day')"   id="dayBtn"   class="active">Day</button>
    <button onclick="setView('week')"  id="weekBtn">Week</button>
    <button onclick="setView('month')" id="monthBtn">Month</button>
  </div>

  <div class="panel">
    <div class="big" id="mainValue">—</div>
    <div class="status-pill" id="statusIndicator">—</div>
    <div class="sub" id="subValue">—</div>
  </div>

  <div class="selected-box" id="selectedBox">Tap a day below to view details</div>

  <div class="log-section">
    <h4>Day <span id="logDayLabel">—</span> Entries</h4>
    <div id="logList"><div class="log-empty">No entries yet</div></div>
  </div>

  <div class="calendar-wrap">
    <div class="calendar-header">
      <div class="cal-day-label">Mo</div>
      <div class="cal-day-label">Tu</div>
      <div class="cal-day-label">We</div>
      <div class="cal-day-label">Th</div>
      <div class="cal-day-label">Fr</div>
      <div class="cal-day-label">Sa</div>
      <div class="cal-day-label">Su</div>
    </div>
    <div class="calendar" id="calendar"></div>
  </div>

</div>

<script>
let view = 'day';
let viewYear  = new Date().getFullYear();
let viewMonth = new Date().getMonth();
let selectedDay = new Date().getDate();

function todayObj() { return new Date(); }

function isCurrentMonth() {
  const t = todayObj();
  return viewYear === t.getFullYear() && viewMonth === t.getMonth();
}

function daysInViewMonth() {
  return new Date(viewYear, viewMonth + 1, 0).getDate();
}

function monthStartOffset() {
  const d = new Date(viewYear, viewMonth, 1).getDay();
  return (d + 6) % 7;
}

function formatMonth(y, m) {
  return new Date(y, m, 1).toLocaleString('default', { month: 'long', year: 'numeric' });
}

function key(y, m) {
  return `gt_${y}-${String(m + 1).padStart(2, '0')}`;
}

function getData(y, m) {
  try {
    return JSON.parse(localStorage.getItem(key(y, m))) || { budget: 0, history: [] };
  } catch(e) {
    return { budget: 0, history: [] };
  }
}

function save(d, y, m) {
  try {
    localStorage.setItem(key(y, m), JSON.stringify(d));
  } catch(e) {
    alert('Could not save: storage may be full.');
  }
}

function saveBudget() {
  const val = parseFloat(document.getElementById('budget').value);
  const d = getData(viewYear, viewMonth);
  d.budget = isNaN(val) || val < 0 ? 0 : val;
  save(d, viewYear, viewMonth);
  render();
}

function prevMonth() {
  if (viewMonth === 0) { viewMonth = 11; viewYear--; }
  else viewMonth--;
  selectedDay = 1;
  render();
}

function nextMonth() {
  if (viewMonth === 11) { viewMonth = 0; viewYear++; }
  else viewMonth++;
  selectedDay = 1;
  render();
}

function calcSpentUpToDay(targetDay, historyList) {
  let total = 0;
  for (let i = 1; i <= targetDay; i++) {
    total += historyList
      .filter(h => h && h.day === i)
      .reduce((s, h) => s + (h.amount || 0), 0);
  }
  return total;
}

function remainingAfterDay(dayNum, y, m) {
  const d = getData(y, m);
  const budget = d.budget || 0;
  const spent = calcSpentUpToDay(dayNum, d.history || []);
  return budget - spent;
}

function todayDateFor(y, m) {
  const t = todayObj();
  return (y === t.getFullYear() && m === t.getMonth()) ? t.getDate() : null;
}

function dailyAllowanceForDay(dayNum, totalDays, y, m) {
  const todayDate = todayDateFor(y, m);
  if (todayDate && dayNum >= todayDate) {
    const remaining = remainingAfterDay(todayDate - 1, y, m);
    const daysLeft = Math.max(1, totalDays - todayDate + 1);
    return remaining / daysLeft;
  } else {
    const remaining = remainingAfterDay(dayNum - 1, y, m);
    const daysLeft = Math.max(1, totalDays - dayNum + 1);
    return remaining / daysLeft;
  }
}

function spentOnDay(dayNum, historyList) {
  return historyList
    .filter(h => h && h.day === dayNum)
    .reduce((s, h) => s + (h.amount || 0), 0);
}

function setView(v) {
  view = v;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById(v + 'Btn');
  if (btn) btn.classList.add('active');
  render();
}

function addSpend() {
  const raw = parseFloat(document.getElementById('spend').value);
  if (isNaN(raw) || raw < 0) {
    alert('Please enter a valid positive amount.');
    return;
  }
  const d = getData(viewYear, viewMonth);
  if (!d.history) d.history = [];
  d.history.push({ day: selectedDay, amount: raw, id: Date.now() });
  save(d, viewYear, viewMonth);
  document.getElementById('spend').value = '';
  render();
}

function deleteEntry(id) {
  const d = getData(viewYear, viewMonth);
  d.history = (d.history || []).filter(h => h.id !== id);
  save(d, viewYear, viewMonth);
  render();
}

function resetDay() {
  if (!confirm(`Clear all entries for Day ${selectedDay}?`)) return;
  const d = getData(viewYear, viewMonth);
  d.history = (d.history || []).filter(h => h && h.day !== selectedDay);
  save(d, viewYear, viewMonth);
  render();
}

function resetMonth() {
  if (!confirm('Reset the entire month? This cannot be undone.')) return;
  localStorage.removeItem(key(viewYear, viewMonth));
  location.reload();
}

function render() {
  const days = daysInViewMonth();
  const todayDate = todayDateFor(viewYear, viewMonth);
  const d = getData(viewYear, viewMonth);
  const historyList = d.history || [];

  if (selectedDay > days) selectedDay = days;

  const ml = document.getElementById('monthLabel');
  if (ml) ml.textContent = formatMonth(viewYear, viewMonth);

  const budgetEl = document.getElementById('budget');
  if (budgetEl && document.activeElement !== budgetEl) {
    budgetEl.value = d.budget || '';
  }

  const allowanceForSelected = dailyAllowanceForDay(selectedDay, days, viewYear, viewMonth);
  const selectedSpend = spentOnDay(selectedDay, historyList);

  let mainAmount = 0;
  let subText = '';

  if (view === 'day') {
    mainAmount = allowanceForSelected - selectedSpend;
    subText = `Left to spend on Day ${selectedDay}`;
  } else if (view === 'week') {
    const endDay = Math.min(selectedDay + 6, days);
    let weekBudget = 0, weekSpent = 0;
    for (let i = selectedDay; i <= endDay; i++) {
      weekBudget += dailyAllowanceForDay(i, days, viewYear, viewMonth);
      weekSpent  += spentOnDay(i, historyList);
    }
    mainAmount = weekBudget - weekSpent;
    subText = `Left for Days ${selectedDay}–${endDay}`;
  } else {
    mainAmount = remainingAfterDay(days, viewYear, viewMonth);
    subText = 'Total remaining for the month';
  }

  const onTrack = mainAmount >= 0;
  document.body.style.background = onTrack ? '#2e7d32' : '#c62828';

  const mainEl = document.getElementById('mainValue');
  if (mainEl) {
    mainEl.textContent = onTrack
      ? `£${mainAmount.toFixed(2)} left`
      : `-£${Math.abs(mainAmount).toFixed(2)} over`;
  }

  const statusEl = document.getElementById('statusIndicator');
  if (statusEl) {
    statusEl.textContent = onTrack ? '✓ On Track' : '⚠ Over Budget';
    statusEl.style.color = onTrack ? '#a5d6a7' : '#ef9a9a';
  }

  const subEl = document.getElementById('subValue');
  if (subEl) subEl.textContent = subText;

  const remainingAfterSelected = remainingAfterDay(selectedDay, viewYear, viewMonth);
  const safeToday = Math.max(0, allowanceForSelected);
  const selectedBoxEl = document.getElementById('selectedBox');
  if (selectedBoxEl) {
    selectedBoxEl.innerHTML =
      `<strong>Day ${selectedDay}</strong> &nbsp;·&nbsp; ` +
      `Remaining after today: <strong>£${remainingAfterSelected.toFixed(2)}</strong><br>` +
      `Safe to spend today: <strong>£${safeToday.toFixed(2)}</strong> &nbsp;·&nbsp; ` +
      `Spent today: <strong>£${selectedSpend.toFixed(2)}</strong>`;
  }

  const logDayLabel = document.getElementById('logDayLabel');
  if (logDayLabel) logDayLabel.textContent = selectedDay;
  const logList = document.getElementById('logList');
  if (logList) {
    const entries = historyList.filter(h => h && h.day === selectedDay);
    if (entries.length === 0) {
      logList.innerHTML = '<div class="log-empty">No entries for this day</div>';
    } else {
      logList.innerHTML = entries.map(e => `
        <div class="log-entry">
          <span class="log-amount">£${(e.amount || 0).toFixed(2)}</span>
          <button class="log-delete" onclick="deleteEntry(${e.id})" title="Delete">×</button>
        </div>
      `).join('');
    }
  }

  const cal = document.getElementById('calendar');
  if (!cal) return;
  cal.innerHTML = '';

  const offset = monthStartOffset();
  for (let i = 0; i < offset; i++) {
    cal.appendChild(document.createElement('div'));
  }

  for (let i = 1; i <= days; i++) {
    const isFuture = todayDate ? i > todayDate : false;
    const isToday  = todayDate ? i === todayDate : false;

    const allowance   = dailyAllowanceForDay(i, days, viewYear, viewMonth);
    const actualSpend = spentOnDay(i, historyList);

    let cls = 'day';
    if (isFuture) {
      cls += ' future';
    } else {
      cls += actualSpend <= allowance ? ' green' : ' red';
    }
    if (isToday)           cls += ' today-ring';
    if (i === selectedDay) cls += ' selected';

    const div = document.createElement('div');
    div.className = cls;

    if (!isFuture) {
      const margin = allowance - actualSpend;
      const sign = margin >= 0 ? '£' : '-£';
      div.textContent = `${i}\n${sign}${Math.abs(margin).toFixed(0)}`;
    } else {
      div.textContent = `${i}\n£${Math.max(0, allowance).toFixed(0)}`;
    }

    div.onclick = () => { selectedDay = i; render(); };
    cal.appendChild(div);
  }
}

try {
  render();
} catch(e) {
  console.error('Initial render error:', e);
}
</script>
</body>
</html>
