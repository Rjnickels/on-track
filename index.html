<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Spend Green</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg:      #1a1a1a;
  --surface: rgba(255,255,255,0.07);
  --border:  rgba(255,255,255,0.12);
  --text:    #f0f0f0;
  --muted:   rgba(255,255,255,0.45);
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Poppins', sans-serif;
  overflow: hidden;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 480px;
  margin: 0 auto;
}

.app-header {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px 24px 8px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.app-header img {
  height: 44px;
  width: auto;
}

.screen {
  display: none;
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0 0 8px;
}
.screen.active { display: flex; flex-direction: column; }

.credit {
  text-align: center;
  font-size: 10px;
  color: rgba(255,255,255,0.2);
  padding: 10px 0 4px;
  letter-spacing: 0.5px;
  flex-shrink: 0;
}

.nav {
  display: flex;
  background: #111;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 10px 0 12px;
  background: none;
  border: none;
  color: var(--muted);
  font-size: 10px;
  font-family: 'Poppins', sans-serif;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  cursor: pointer;
  transition: color 0.2s;
}
.nav-btn svg { transition: transform 0.2s; }
.nav-btn.active { color: var(--text); }
.nav-btn.active svg { transform: scale(1.1); }

.home-top {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px 24px 8px;
  gap: 8px;
}

.date-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 4px;
}
.day-arrow {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  width: 30px; height: 30px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
  flex-shrink: 0;
}
.day-arrow:hover { background: rgba(255,255,255,0.14); }
.day-arrow:disabled { opacity: 0.25; cursor: default; }
.date-label {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
  text-align: center;
  min-width: 160px;
}
.date-label.is-today { color: var(--text); }

.ring-wrap {
  position: relative;
  width: 200px;
  height: 200px;
  margin: 4px 0;
}
.ring-wrap svg {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  transform: rotate(-90deg);
}
.ring-track {
  fill: none;
  stroke: rgba(255,255,255,0.08);
  stroke-width: 12;
}
.ring-fill {
  fill: none;
  stroke-width: 12;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.6s cubic-bezier(.4,0,.2,1), stroke 0.6s ease;
}
.ring-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
}
.ring-amount {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -1px;
  line-height: 1;
  transition: color 0.6s;
}
.ring-label {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
}
.ring-status {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-top: 2px;
  transition: color 0.4s;
}

@keyframes shake {
  0%,100% { transform: translateX(0); }
  20%     { transform: translateX(-6px); }
  40%     { transform: translateX(6px); }
  60%     { transform: translateX(-4px); }
  80%     { transform: translateX(4px); }
}
@keyframes pulse-ring {
  0%,100% { opacity: 1; }
  50%     { opacity: 0.5; }
}
.ring-wrap.over {
  animation: shake 0.5s ease, pulse-ring 1.4s ease infinite 0.5s;
}

.view-tabs {
  display: flex;
  gap: 6px;
  padding: 0 24px;
  margin-bottom: 4px;
  width: 100%;
}
.view-tab {
  flex: 1;
  padding: 9px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  font-family: 'Poppins', sans-serif;
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
  text-align: center;
}
.view-tab.active { background: white; color: #111; border-color: white; }

.spend-area {
  padding: 8px 24px 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.input-row { display: flex; gap: 8px; }
.input-wrap { flex: 1; position: relative; }
.input-wrap span {
  position: absolute;
  left: 13px; top: 50%;
  transform: translateY(-50%);
  color: #666;
  font-weight: 600;
  font-size: 15px;
  pointer-events: none;
}
.input-wrap input {
  width: 100%;
  padding: 13px 13px 13px 28px;
  border: 1px solid var(--border);
  border-radius: 9px;
  font-size: 15px;
  font-family: 'Poppins', sans-serif;
  background: rgba(255,255,255,0.06);
  color: var(--text);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.input-wrap input::placeholder { color: rgba(255,255,255,0.25); }
.input-wrap input:focus {
  border-color: rgba(255,255,255,0.35);
  box-shadow: 0 0 0 3px rgba(255,255,255,0.07);
}
.input-wrap input::-webkit-inner-spin-button,
.input-wrap input::-webkit-outer-spin-button { -webkit-appearance: none; }

.btn-add {
  padding: 13px 20px;
  border: none;
  border-radius: 9px;
  font-size: 15px;
  font-weight: 700;
  font-family: 'Poppins', sans-serif;
  background: white;
  color: #111;
  cursor: pointer;
  transition: transform 0.1s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  white-space: nowrap;
}
.btn-add:active { transform: scale(0.97); }

.btn-clear {
  width: 100%;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 9px;
  font-size: 12px;
  font-weight: 500;
  font-family: 'Poppins', sans-serif;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.btn-clear:hover { background: var(--surface); color: var(--text); }

.budget-setup {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
  gap: 16px;
  text-align: center;
}
.budget-setup h2 { font-size: 20px; font-weight: 700; }
.budget-setup p { color: var(--muted); font-size: 13px; line-height: 1.7; }
.budget-setup .input-wrap { width: 100%; }
.btn-set {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 9px;
  font-size: 15px;
  font-weight: 700;
  font-family: 'Poppins', sans-serif;
  background: white;
  color: #111;
  cursor: pointer;
}

.cal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px 10px;
}
.cal-header h2 { font-size: 17px; font-weight: 700; }
.cal-nav-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  width: 32px; height: 32px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
}
.cal-day-labels {
  display: grid;
  grid-template-columns: repeat(7,1fr);
  gap: 3px;
  padding: 0 16px 4px;
}
.cal-day-label {
  text-align: center;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.5px;
  color: var(--muted);
  text-transform: uppercase;
  padding: 2px 0;
}
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7,1fr);
  gap: 3px;
  padding: 0 16px;
}
.cal-cell {
  aspect-ratio: 1;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-weight: 700;
  line-height: 1.3;
  text-align: center;
  transition: transform 0.1s;
  user-select: none;
}
.cal-cell:active { transform: scale(0.93); }
.cal-cell .cal-num { font-size: 12px; }
.cal-cell .cal-val { font-size: 8px; opacity: 0.85; }
.cal-cell.green  { background: #1b5e20; color: #c8e6c9; }
.cal-cell.red    { background: #b71c1c; color: #ffcdd2; }
.cal-cell.future { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.5); }
.cal-cell.today  { outline: 2px solid rgba(255,255,255,0.5); outline-offset: 1px; }
.cal-cell.selected { outline: 2px solid white; box-shadow: 0 0 10px rgba(255,255,255,0.3); }

.log-header { padding: 16px 24px 8px; }
.log-header h2 { font-size: 17px; font-weight: 700; }
.log-header p  { font-size: 12px; color: var(--muted); margin-top: 2px; }

.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 8px 24px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
}
.stat-card .stat-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--muted);
  margin-bottom: 5px;
}
.stat-card .stat-val {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.log-entries { padding: 8px 24px; }
.log-entries h3 {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--muted);
  margin-bottom: 8px;
}
.log-entry {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 11px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 9px;
  margin-bottom: 6px;
}
.log-entry .log-amt { font-size: 15px; font-weight: 600; }
.log-del {
  background: none; border: none;
  color: var(--muted); font-size: 20px;
  cursor: pointer; padding: 0 4px;
  transition: color 0.2s; line-height: 1;
}
.log-del:hover { color: #ef9a9a; }
.log-empty {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  padding: 28px 0;
}

.divider { height: 1px; background: var(--border); margin: 8px 24px; }

.reset-btn {
  margin: 8px 24px 0;
  width: calc(100% - 48px);
  padding: 11px;
  border: 1px solid rgba(239,154,154,0.3);
  border-radius: 9px;
  font-size: 12px;
  font-weight: 500;
  font-family: 'Poppins', sans-serif;
  background: transparent;
  color: #ef9a9a;
  cursor: pointer;
  transition: background 0.2s;
}
.reset-btn:hover { background: rgba(239,154,154,0.08); }
</style>
</head>
<body>

<div class="app">

  <header class="app-header">
    <img src="logo.png" alt="Spend Green"/>
  </header>

  <!-- HOME -->
  <div class="screen active" id="homeScreen">

    <div class="budget-setup" id="budgetSetup">
      <h2>Welcome to Spend Green</h2>
      <p>Enter your monthly disposable income to get started.</p>
      <div class="input-wrap">
        <span>£</span>
        <input id="budgetInput" type="number" min="0" placeholder="Monthly budget"/>
      </div>
      <button class="btn-set" onclick="setBudget()">Set Budget</button>
    </div>

    <div class="home-top" id="homeMain" style="display:none">
      <div class="date-row">
        <button class="day-arrow" id="dayPrev" onclick="shiftDay(-1)">&#8249;</button>
        <div class="date-label" id="dateLabel">—</div>
        <button class="day-arrow" id="dayNext" onclick="shiftDay(1)">&#8250;</button>
      </div>

      <div class="ring-wrap" id="ringWrap">
        <svg viewBox="0 0 220 220">
          <circle class="ring-track" cx="110" cy="110" r="95"/>
          <circle class="ring-fill" id="ringFill" cx="110" cy="110" r="95"/>
        </svg>
        <div class="ring-center">
          <div class="ring-amount" id="ringAmount">—</div>
          <div class="ring-label">remaining</div>
          <div class="ring-status" id="ringStatus">—</div>
        </div>
      </div>

      <div class="view-tabs">
        <button class="view-tab active" id="tabDay"   onclick="setView('day')">Day</button>
        <button class="view-tab"        id="tabWeek"  onclick="setView('week')">Week</button>
        <button class="view-tab"        id="tabMonth" onclick="setView('month')">Month</button>
      </div>
    </div>

    <div class="spend-area" id="spendArea" style="display:none">
      <div class="input-row">
        <div class="input-wrap">
          <span>£</span>
          <input id="spendInput" type="number" min="0" placeholder="How much did you spend?"/>
        </div>
        <button class="btn-add" onclick="addSpend()">Add</button>
      </div>
      <button class="btn-clear" onclick="clearSelectedDay()">Clear this day's entries</button>
    </div>

    <div class="credit">Created by Robert Nickels</div>
  </div>

  <!-- CALENDAR -->
  <div class="screen" id="calScreen">
    <div class="cal-header">
      <button class="cal-nav-btn" onclick="prevMonth()">&#8249;</button>
      <h2 id="calMonthLabel">—</h2>
      <button class="cal-nav-btn" onclick="nextMonth()">&#8250;</button>
    </div>
    <div class="cal-day-labels">
      <div class="cal-day-label">Mo</div>
      <div class="cal-day-label">Tu</div>
      <div class="cal-day-label">We</div>
      <div class="cal-day-label">Th</div>
      <div class="cal-day-label">Fr</div>
      <div class="cal-day-label">Sa</div>
      <div class="cal-day-label">Su</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="credit">Created by Robert Nickels</div>
  </div>

  <!-- LOG -->
  <div class="screen" id="logScreen">
    <div class="log-header">
      <h2>Summary</h2>
      <p id="logDateLabel">—</p>
    </div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Safe today</div>
        <div class="stat-val" id="statAllowance">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Spent today</div>
        <div class="stat-val" id="statSpent">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Left this month</div>
        <div class="stat-val" id="statMonthLeft">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Monthly budget</div>
        <div class="stat-val" id="statBudget">—</div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="log-entries">
      <h3>Entries — Day <span id="logDayNum">—</span></h3>
      <div id="logList"></div>
    </div>
    <div class="divider"></div>
    <button class="reset-btn" onclick="resetMonth()">Reset whole month</button>
    <div class="credit">Created by Robert Nickels</div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="nav">
    <button class="nav-btn active" id="navHome" onclick="goTab('home')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      Home
    </button>
    <button class="nav-btn" id="navCal" onclick="goTab('cal')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      Calendar
    </button>
    <button class="nav-btn" id="navLog" onclick="goTab('log')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
        <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
      </svg>
      Log
    </button>
  </nav>

</div>

<script>
let view        = 'day';
let viewYear    = new Date().getFullYear();
let viewMonth   = new Date().getMonth();
let selectedDay = new Date().getDate();
let activeTab   = 'home';

const $ = id => document.getElementById(id);
const fmt = n => '£' + Math.abs(n).toFixed(2);

function todayObj()   { return new Date(); }
function todayDate()  { return todayObj().getDate(); }
function todayYear()  { return todayObj().getFullYear(); }
function todayMonth() { return todayObj().getMonth(); }

function isCurrentMonth() {
  return viewYear === todayYear() && viewMonth === todayMonth();
}

function daysInMonth(y, m) {
  return new Date(y, m + 1, 0).getDate();
}

function monthStartOffset(y, m) {
  return (new Date(y, m, 1).getDay() + 6) % 7;
}

function formatMonth(y, m) {
  return new Date(y, m, 1).toLocaleString('default', { month: 'long', year: 'numeric' });
}

function formatDay(day, y, m) {
  const isToday = day === todayDate() && y === todayYear() && m === todayMonth();
  if (isToday) return 'Today';
  return new Date(y, m, day).toLocaleDateString('default', { weekday: 'short', day: 'numeric', month: 'short' });
}

function storageKey(y, m) {
  return `gt_${y}-${String(m+1).padStart(2,'0')}`;
}

function getData(y, m) {
  try { return JSON.parse(localStorage.getItem(storageKey(y,m))) || {budget:0,history:[]}; }
  catch(e) { return {budget:0,history:[]}; }
}

function saveData(d, y, m) {
  try { localStorage.setItem(storageKey(y,m), JSON.stringify(d)); }
  catch(e) { alert('Could not save — storage may be full.'); }
}

function spentOnDay(day, history) {
  return history.filter(h => h && h.day === day).reduce((s,h) => s+(h.amount||0), 0);
}

function spentUpToDay(day, history) {
  let t = 0;
  for (let i = 1; i <= day; i++) t += spentOnDay(i, history);
  return t;
}

function remainingAfter(day, y, m) {
  const d = getData(y, m);
  return (d.budget||0) - spentUpToDay(day, d.history||[]);
}

function todayDateFor(y, m) {
  return (y===todayYear() && m===todayMonth()) ? todayDate() : null;
}

function dailyAllowance(day, totalDays, y, m) {
  const td = todayDateFor(y, m);
  if (td && day >= td) {
    const rem   = remainingAfter(td - 1, y, m);
    const dLeft = Math.max(1, totalDays - td + 1);
    return rem / dLeft;
  } else {
    const rem   = remainingAfter(day - 1, y, m);
    const dLeft = Math.max(1, totalDays - day + 1);
    return rem / dLeft;
  }
}

function ringColor(ratio) {
  if (ratio <= 0)   return '#b71c1c';
  if (ratio < 0.25) return '#c62828';
  if (ratio < 0.5)  return '#e65100';
  if (ratio < 0.75) return '#f9a825';
  return '#2e7d32';
}

function setBudget() {
  const val = parseFloat($('budgetInput').value);
  if (isNaN(val) || val <= 0) { alert('Please enter a valid budget.'); return; }
  const d = getData(viewYear, viewMonth);
  d.budget = val;
  saveData(d, viewYear, viewMonth);
  render();
}

function shiftDay(dir) {
  const newDay = selectedDay + dir;
  if (newDay < 1 || newDay > todayDate()) return;
  selectedDay = newDay;
  render();
}

function addSpend() {
  const raw = parseFloat($('spendInput').value);
  if (isNaN(raw) || raw < 0) { alert('Please enter a valid amount.'); return; }
  const d = getData(viewYear, viewMonth);
  if (!d.history) d.history = [];
  d.history.push({ day: selectedDay, amount: raw, id: Date.now() });
  saveData(d, viewYear, viewMonth);
  $('spendInput').value = '';
  render();
}

function deleteEntry(id) {
  const d = getData(viewYear, viewMonth);
  d.history = (d.history||[]).filter(h => h.id !== id);
  saveData(d, viewYear, viewMonth);
  render();
}

function clearSelectedDay() {
  if (!confirm(`Clear all entries for ${formatDay(selectedDay, viewYear, viewMonth)}?`)) return;
  const d = getData(viewYear, viewMonth);
  d.history = (d.history||[]).filter(h => h && h.day !== selectedDay);
  saveData(d, viewYear, viewMonth);
  render();
}

function resetMonth() {
  if (!confirm('Reset the whole month? All data will be lost.')) return;
  localStorage.removeItem(storageKey(viewYear, viewMonth));
  viewYear    = todayYear();
  viewMonth   = todayMonth();
  selectedDay = todayDate();
  view        = 'day';
  goTab('home');
}

function setView(v) {
  view = v;
  ['day','week','month'].forEach(x => {
    $('tab' + x.charAt(0).toUpperCase() + x.slice(1)).classList.toggle('active', x === v);
  });
  render();
}

function goTab(tab) {
  activeTab = tab;
  ['home','cal','log'].forEach(t => {
    $(`${t}Screen`).classList.toggle('active', t === tab);
    $(`nav${t.charAt(0).toUpperCase()+t.slice(1)}`).classList.toggle('active', t === tab);
  });
  render();
}

function prevMonth() {
  if (viewMonth === 0) { viewMonth = 11; viewYear--; }
  else viewMonth--;
  selectedDay = 1;
  render();
}

function nextMonth() {
  if (viewMonth === 11) { viewMonth = 0; viewYear++; }
  else viewMonth++;
  selectedDay = 1;
  render();
}

function render() {
  const d       = getData(viewYear, viewMonth);
  const history = d.history || [];
  const budget  = d.budget  || 0;
  const days    = daysInMonth(viewYear, viewMonth);
  const td      = todayDateFor(viewYear, viewMonth);

  if (activeTab === 'home') {
    const hasBudget = budget > 0;
    $('budgetSetup').style.display = hasBudget ? 'none' : 'flex';
    $('homeMain').style.display    = hasBudget ? 'flex' : 'none';
    $('spendArea').style.display   = hasBudget ? 'flex' : 'none';

    if (hasBudget) {
      const isToday = selectedDay === todayDate() && isCurrentMonth();
      const dlEl = $('dateLabel');
      dlEl.textContent = formatDay(selectedDay, viewYear, viewMonth);
      dlEl.classList.toggle('is-today', isToday);
      $('dayPrev').disabled = selectedDay <= 1;
      $('dayNext').disabled = isToday;

      let amount = 0, totalForView = 0;

      if (view === 'day') {
        const allowance = dailyAllowance(selectedDay, days, viewYear, viewMonth);
        const spent     = spentOnDay(selectedDay, history);
        amount       = allowance - spent;
        totalForView = allowance;
      } else if (view === 'week') {
        const end = Math.min(selectedDay + 6, days);
        let b = 0, s = 0;
        for (let i = selectedDay; i <= end; i++) {
          b += dailyAllowance(i, days, viewYear, viewMonth);
          s += spentOnDay(i, history);
        }
        amount       = b - s;
        totalForView = b;
      } else {
        amount       = remainingAfter(days, viewYear, viewMonth);
        totalForView = budget;
      }

      const circumference = 2 * Math.PI * 95;
      const ratio  = totalForView > 0 ? Math.max(0, amount) / totalForView : 0;
      const offset = circumference * (1 - Math.min(1, ratio));
      const color  = ringColor(ratio);
      const fill   = $('ringFill');
      fill.style.strokeDasharray  = circumference;
      fill.style.strokeDashoffset = offset;
      fill.style.stroke           = color;

      $('ringWrap').classList.toggle('over', amount < 0);
      $('ringAmount').textContent = amount >= 0
        ? `£${amount.toFixed(2)}`
        : `-£${Math.abs(amount).toFixed(2)}`;
      $('ringAmount').style.color = color;
      $('ringStatus').textContent = amount >= 0 ? '✓ on track' : '⚠ over budget';
      $('ringStatus').style.color = amount >= 0 ? '#81c784' : '#ef9a9a';
    }
  }

  if (activeTab === 'cal') {
    $('calMonthLabel').textContent = formatMonth(viewYear, viewMonth);
    const grid = $('calGrid');
    grid.innerHTML = '';
    const offset = monthStartOffset(viewYear, viewMonth);
    for (let i = 0; i < offset; i++) grid.appendChild(document.createElement('div'));

    for (let i = 1; i <= days; i++) {
      const isFuture    = td ? i > td : false;
      const isToday     = td ? i === td : false;
      const allowance   = dailyAllowance(i, days, viewYear, viewMonth);
      const actualSpend = spentOnDay(i, history);

      let cls = 'cal-cell';
      if (isFuture)        cls += ' future';
      else                 cls += actualSpend <= allowance ? ' green' : ' red';
      if (isToday)         cls += ' today';
      if (i===selectedDay) cls += ' selected';

      const cell = document.createElement('div');
      cell.className = cls;
      const margin = allowance - actualSpend;
      const sign   = margin >= 0 ? '£' : '-£';
      cell.innerHTML = isFuture
        ? `<span class="cal-num">${i}</span><span class="cal-val">£${Math.max(0,allowance).toFixed(0)}</span>`
        : `<span class="cal-num">${i}</span><span class="cal-val">${sign}${Math.abs(margin).toFixed(0)}</span>`;
      cell.onclick = () => { selectedDay = i; render(); };
      grid.appendChild(cell);
    }
  }

  if (activeTab === 'log') {
    const displayDay = isCurrentMonth() ? todayDate() : selectedDay;
    const allowance  = dailyAllowance(displayDay, days, viewYear, viewMonth);
    const spent      = spentOnDay(displayDay, history);

    $('logDateLabel').textContent  = formatMonth(viewYear, viewMonth);
    $('logDayNum').textContent     = displayDay;
    $('statAllowance').textContent = fmt(Math.max(0, allowance));
    $('statSpent').textContent     = fmt(spent);
    $('statMonthLeft').textContent = fmt(remainingAfter(days, viewYear, viewMonth));
    $('statBudget').textContent    = fmt(budget);

    const entries = history.filter(h => h && h.day === displayDay);
    const list    = $('logList');
    if (entries.length === 0) {
      list.innerHTML = '<div class="log-empty">Nothing logged for today</div>';
    } else {
      list.innerHTML = entries.map(e => `
        <div class="log-entry">
          <span class="log-amt">${fmt(e.amount||0)}</span>
          <button class="log-del" onclick="deleteEntry(${e.id})">×</button>
        </div>
      `).join('');
    }
  }
}

try { render(); } catch(e) { console.error(e); }
</script>
</body>
</html>
