<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stay Green</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    transition: background 0.3s ease;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }

  .container {
    text-align: center;
    width: 90%;
    max-width: 420px;
  }

  input, button {
    width: 100%;
    padding: 12px;
    margin: 6px 0;
    border: none;
    border-radius: 8px;
    font-size: 16px;
  }

  button {
    background: white;
    color: black;
    font-weight: bold;
    cursor: pointer;
  }

  .tabs {
    display: flex;
    gap: 6px;
    margin-top: 10px;
  }

  .tabs button {
    flex: 1;
    background: rgba(255,255,255,0.2);
    color: white;
  }

  .tabs button.active {
    background: white;
    color: black;
  }

  .big {
    font-size: 46px;
    margin: 10px 0;
  }

  .money {
    font-size: 18px;
    margin: 10px 0;
  }

  .small {
    font-size: 14px;
    opacity: 0.9;
  }
</style>
</head>

<body>

<div class="container">
  <h1>Stay Green</h1>

  <input id="budget" type="number" placeholder="Monthly disposable income (£)" />

  <input id="customSpend" type="number" placeholder="Enter spend (£)" />

  <button onclick="addSpend()">Add Spend</button>
  <button onclick="undoLast()">Undo Last Spend</button>
  <button onclick="resetApp()">Reset Month</button>

  <div class="tabs">
    <button onclick="setView('day')" id="tab-day" class="active">Day</button>
    <button onclick="setView('week')" id="tab-week">Week</button>
    <button onclick="setView('month')" id="tab-month">Month</button>
  </div>

  <div class="big" id="status">—</div>
  <div class="money" id="remaining">—</div>
  <div class="small" id="details"></div>
</div>

<script>
let view = "day";

// --- DATE HELPERS (FIXED PROPERLY) ---
function monthKey(date = new Date()) {
  return `${date.getFullYear()}-${date.getMonth()}`;
}

function dayKey(date = new Date()) {
  return `${date.getFullYear()}-${date.getMonth()}-${date.getDate()}`;
}

function weekKey(date = new Date()) {
  const start = new Date(date);
  start.setDate(date.getDate() - date.getDay());
  return `${start.getFullYear()}-${start.getMonth()}-W${start.getDate()}`;
}

// --- STORAGE ---
function getData() {
  const key = monthKey();
  return JSON.parse(localStorage.getItem(key)) || {
    budget: 0,
    spent: 0,
    history: []
  };
}

function saveData(data) {
  localStorage.setItem(monthKey(), JSON.stringify(data));
}

// --- BUDGET ---
document.getElementById("budget").addEventListener("change", (e) => {
  const data = getData();
  data.budget = parseFloat(e.target.value);
  saveData(data);
  updateUI();
});

// --- SPENDING ---
function addSpend() {
  const val = parseFloat(document.getElementById("customSpend").value);
  if (isNaN(val)) return;

  const data = getData();
  data.spent += val;
  data.history.push({
    amount: val,
    time: new Date().toISOString()
  });

  saveData(data);
  document.getElementById("customSpend").value = "";
  updateUI();
}

// --- UNDO LAST SPEND ---
function undoLast() {
  const data = getData();
  const last = data.history.pop();

  if (!last) return;

  data.spent -= last.amount;
  if (data.spent < 0) data.spent = 0;

  saveData(data);
  updateUI();
}

// --- RESET ---
function resetApp() {
  localStorage.removeItem(monthKey());
  location.reload();
}

// --- VIEW SWITCH ---
function setView(v) {
  view = v;

  document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
  document.getElementById("tab-" + v).classList.add("active");

  updateUI();
}

// --- CORE LOGIC (FIXED CALENDAR AWARE) ---
function updateUI() {
  const data = getData();
  const now = new Date();

  const day = now.getDate();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();

  let expected = 0;
  let label = "";

  if (view === "day") {
    expected = data.budget / daysInMonth;
    label = "Today";
  }

  if (view === "week") {
    expected = (data.budget / daysInMonth) * 7;
    label = "This Week";
  }

  if (view === "month") {
    expected = data.budget;
    label = "This Month";
  }

  const remaining = expected - data.spent;

  const status = document.getElementById("status");
  const remainingEl = document.getElementById("remaining");
  const details = document.getElementById("details");

  if (remaining >= 0) {
    document.body.style.background = "#1f8f4a";
    status.innerHTML = "🟢 GREEN";
    remainingEl.innerHTML = `Safe to spend £${remaining.toFixed(2)}`;
  } else {
    document.body.style.background = "#c0392b";
    status.innerHTML = "🔴 RED";
    remainingEl.innerHTML = `Over by £${Math.abs(remaining).toFixed(2)}`;
  }

  details.innerHTML = `
    <b>${label}</b><br><br>
    Budget: £${data.budget || 0}<br>
    Spent: £${data.spent.toFixed(2)}<br>
    Allowed: £${expected.toFixed(2)}
  `;
}

updateUI();
</script>

</body>
</html>
