<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stay Green</title>

<style>
body{
  margin:0;
  font-family:Arial;
  transition:0.3s;
  color:white;
  display:flex;
  justify-content:center;
  padding:20px;
  min-height:100vh;
}

.container{width:100%;max-width:560px;text-align:center;}

.inputWrap{position:relative;margin:6px 0;}

.currency{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  opacity:0.6;
  color:black;
  font-weight:bold;
}

input{
  width:100%;
  padding:12px 12px 12px 28px;
  border:none;
  border-radius:8px;
  font-size:16px;
  box-sizing: border-box;
}

button{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:none;
  border-radius:8px;
  font-size:16px;
  background:white;
  color:black;
  font-weight:bold;
  cursor:pointer;
}

.btnRow{display:flex;gap:8px;}
.btnRow button{width:50%;font-size:13px;padding:10px;}

.tabs{display:flex;gap:6px;margin:10px 0;}
.tabs button{flex:1;background:rgba(255,255,255,0.2);color:white;}
.tabs button.active{background:white;color:black;}

.panel{
  background:rgba(255,255,255,0.12);
  padding:14px;
  border-radius:10px;
  margin:10px 0;
}

.big{font-size:22px;font-weight:bold;}
.sub{font-size:14px;opacity:0.9;}

.selectedBox{
  margin:10px 0;
  padding:10px;
  border-radius:8px;
  background:rgba(255,255,255,0.12);
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
  margin-top:10px;
}

.day{
  padding:10px 0;
  border-radius:8px;
  font-size:10px;
  cursor:pointer;
  white-space:pre-line;
}

.green{background:#1f8f4a;}
.red{background:#c0392b;}
.future{background:rgba(255,255,255,0.35);color:black;}
.selected{outline:2px solid white;}
</style>
</head>

<body>

<div class="container">
<h1>Stay Green</h1>

<div class="inputWrap">
<span class="currency">£</span>
<input id="budget" type="number" placeholder="Monthly budget" oninput="saveBudget()"/>
</div>

<div class="inputWrap">
<span class="currency">£</span>
<input id="spend" type="number" placeholder="Spend"/>
</div>

<button onclick="addSpend()">Add Spend</button>

<div class="btnRow">
<button onclick="resetDay()">Reset Day</button>
<button onclick="resetMonth()">Reset Month</button>
</div>

<div class="tabs">
<button onclick="setView('day')" id="dayBtn" class="active">
