<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stay Green</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    transition: background 0.3s ease;
    color: white;
    display: flex;
    justify-content: center;
    padding: 20px;
    min-height: 100vh;
  }

  .container {
    width: 100%;
    max-width: 520px;
    text-align: center;
  }

  input, button {
    width: 100%;
    padding: 12px;
    margin: 6px 0;
    border: none;
    border-radius: 8px;
    font-size: 16px;
  }

  button {
    background: white;
    color: black;
    font-weight: bold;
    cursor: pointer;
  }

  .panel {
    margin: 12px 0;
    padding: 14px;
    border-radius: 10px;
    background: rgba(255,255,255,0.12);
  }

  .safe {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 6px;
  }

  .sub {
    font-size: 14px;
    opacity: 0.9;
  }

  .calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-top: 15px;
  }

  .day {
    padding: 10px 0;
    border-radius: 8px;
    font-size: 12px;
    background: rgba(255,255,255,0.2);
    color: black;
    cursor: pointer;
  }

  .green { background: #1f8f4a; color: white; }
  .red { background: #c0392b; color: white; }
  .future { background: rgba(255,255,255,0.35); color: black; }

  .selectedBox {
    margin-top: 12px;
    font-size: 14px;
    background: rgba(255,255,255,0.12);
    padding: 10px;
    border-radius: 8px;
  }
</style>
</head>

<body>

<div class="container">
  <h1>Stay Green</h1>

  <input id="budget" type="number" placeholder="Monthly disposable income (£)" />

  <input id="spend" type="number" placeholder="Enter spend (£)" />
  <button onclick="addSpend()">Add Spend</button>
  <button onclick="undoLast()">Undo Last</button>
  <button onclick="resetApp()">Reset Month</button>

  <!-- 🔥 RESTORED MAIN PANEL -->
  <div class="panel" id="panel">
    <div class="safe" id="safeText">—</div>
    <div class="sub" id="periodText">—</div>
    <div class="sub" id="breakdownText">—</div>
  </div>

  <div class="calendar" id="calendar"></div>

  <div class="selectedBox" id="selectedDay">
    Click a day to see details
  </div>
</div>

<script>

function monthKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()}`;
}

function getData() {
  return JSON.parse(localStorage.getItem(monthKey())) || {
    budget: 0,
    history: []
  };
}

function saveData(data) {
  localStorage.setItem(monthKey(), JSON.stringify(data));
}

// budget
document.getElementById("budget").addEventListener("change", (e) => {
  const data = getData();
  data.budget = parseFloat(e.target.value);
  saveData(data);
  updateUI();
});

// spend
function addSpend() {
  const val = parseFloat(document.getElementById("spend").value);
  if (isNaN(val)) return;

  const data = getData();
  const today = new Date().getDate();

  data.history.push({ amount: val, day: today });

  saveData(data);
  document.getElementById("spend").value = "";
  updateUI();
}

// undo
function undoLast() {
  const data = getData();
  data.history.pop();
  saveData(data);
  updateUI();
}

// reset
function resetApp() {
  localStorage.removeItem(monthKey());
  location.reload();
}

// helpers
function getDaySpend(data, day) {
  return data.history
    .filter(h => h.day === day)
    .reduce((s, h) => s + h.amount, 0);
}

// calendar
function renderCalendar(data) {
  const el = document.getElementById("calendar");
  el.innerHTML = "";

  const now = new Date();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const today = now.getDate();

  const dailyBudget = data.budget / daysInMonth;

  for (let d = 1; d <= daysInMonth; d++) {

    const spend = getDaySpend(data, d);

    let cls = "day";

    if (d > today) cls += " future";
    else if (spend <= dailyBudget) cls += " green";
    else cls += " red";

    const div = document.createElement("div");
    div.className = cls;
    div.innerText = d;

    div.onclick = () => {
      document.getElementById("selectedDay").innerHTML = `
        <b>Day ${d}</b><br>
        Spent: £${spend.toFixed(2)}<br>
        Budget: £${dailyBudget.toFixed(2)}
      `;
    };

    el.appendChild(div);
  }
}

// 🔥 RESTORED SUMMARY PANEL LOGIC
function updatePanel(data) {
  const now = new Date();

  const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const todaySpend = getDaySpend(data, now.getDate());

  const allowedDaily = data.budget / daysInMonth;
  const remaining = data.budget - data.history.reduce((s,h)=>s+h.amount,0);

  document.getElementById("safeText").innerHTML =
    `Safe to spend £${remaining.toFixed(2)}`;

  document.getElementById("periodText").innerHTML =
    `This Month`;

  document.getElementById("breakdownText").innerHTML =
    `Budget: £${data.budget || 0}<br>
     Spent: £${data.history.reduce((s,h)=>s+h.amount,0).toFixed(2)}<br>
     Allowed: £${data.budget || 0}`;
}

// main
function updateUI() {
  const data = getData();

  const totalSpent = data.history.reduce((s,h)=>s+h.amount,0);
  const nowSpentToday = getDaySpend(data, new Date().getDate());
  const dailyBudget = data.budget / new Date().getDate();

  if (nowSpentToday <= dailyBudget) {
    document.body.style.background = "#1f8f4a";
  } else {
    document.body.style.background = "#c0392b";
  }

  updatePanel(data);
  renderCalendar(data);
}

updateUI();

</script>

</body>
</html>
