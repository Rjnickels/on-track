<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stay Green</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    transition: background 0.3s ease;
    color: white;
    display: flex;
    justify-content: center;
    padding: 20px;
    min-height: 100vh;
  }

  .container {
    width: 100%;
    max-width: 560px;
    text-align: center;
  }

  .inputWrap {
    position: relative;
    margin: 6px 0;
  }

  .currency {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: black;
    opacity: 0.6;
    font-weight: bold;
  }

  input {
    width: 100%;
    padding: 12px 12px 12px 28px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
  }

  button {
    width: 100%;
    padding: 12px;
    margin: 6px 0;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    background: white;
    color: black;
    font-weight: bold;
    cursor: pointer;
  }

  .tabs {
    display: flex;
    gap: 6px;
    margin: 10px 0;
  }

  .tabs button {
    flex: 1;
    background: rgba(255,255,255,0.2);
    color: white;
  }

  .tabs button.active {
    background: white;
    color: black;
  }

  .panel {
    background: rgba(255,255,255,0.12);
    padding: 14px;
    border-radius: 10px;
    margin: 10px 0;
  }

  .big { font-size: 22px; font-weight: bold; }
  .sub { font-size: 14px; opacity: 0.9; }

  .error {
    color: #ff4d4d;
    font-size: 14px;
    margin-top: 5px;
  }

  .calendarHeader {
    margin-top: 10px;
    font-size: 14px;
    opacity: 0.9;
  }

  .selectedBox {
    margin: 10px 0;
    font-size: 14px;
    background: rgba(255,255,255,0.12);
    padding: 10px;
    border-radius: 8px;
  }

  .calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-top: 10px;
  }

  .day {
    padding: 10px 0;
    border-radius: 8px;
    font-size: 11px;
    background: rgba(255,255,255,0.2);
    color: black;
    cursor: pointer;
    white-space: pre-line;
  }

  .green { background: #1f8f4a; color: white; }
  .red { background: #c0392b; color: white; }
  .future { background: rgba(255,255,255,0.35); color: black; }
</style>
</head>

<body>

<div class="container">
  <h1>Stay Green</h1>

  <!-- £ BUDGET -->
  <div class="inputWrap">
    <span class="currency">£</span>
    <input id="budget" type="number" placeholder="Monthly disposable income" />
  </div>

  <!-- £ SPEND -->
  <div class="inputWrap">
    <span class="currency">£</span>
    <input id="spend" type="number" placeholder="Enter spend" />
  </div>

  <div id="error" class="error"></div>

  <button onclick="addSpend()">Add Spend</button>
  <button onclick="resetSelectedDay()">Reset Selected Day</button>
  <button onclick="resetMonth()">Reset Month</button>

  <div class="panel">
    <div class="big" id="safeText">—</div>
    <div class="sub" id="periodText">Running Balance</div>
    <div class="sub" id="breakdownText">—</div>
  </div>

  <div class="selectedBox" id="selectedDayBox">
    Click a day to inspect balance
  </div>

  <div class="calendarHeader" id="calendarHeader"></div>
  <div class="calendar" id="calendar"></div>
</div>

<script>

let selectedDay = null;

function now() {
  return new Date();
}

function monthKey() {
  const d = now();
  return `${d.getFullYear()}-${d.getMonth()}`;
}

function getData() {
  return JSON.parse(localStorage.getItem(monthKey())) || {
    budget: 0,
    history: []
  };
}

function saveData(data) {
  localStorage.setItem(monthKey(), JSON.stringify(data));
}

// ---------------- BUDGET INPUT ----------------
document.getElementById("budget").addEventListener("input", (e) => {
  const data = getData();
  const v = parseFloat(e.target.value);
  data.budget = isNaN(v) ? 0 : v;
  saveData(data);
  updateUI();
});

// ---------------- ADD SPEND ----------------
function addSpend() {

  const err = document.getElementById("error");
  err.innerText = "";

  const val = parseFloat(document.getElementById("spend").value);

  if (isNaN(val)) return;

  if (!selectedDay) {
    err.innerText = "Select a day first";
    return;
  }

  const data = getData();

  data.history.push({
    amount: val,
    day: selectedDay
  });

  saveData(data);

  document.getElementById("spend").value = "";
  updateUI();
}

// ---------------- RESET ----------------
function resetSelectedDay() {
  if (!selectedDay) return;

  const data = getData();
  data.history = data.history.filter(h => h.day !== selectedDay);
  saveData(data);
  updateUI();
}

function resetMonth() {
  localStorage.removeItem(monthKey());
  location.reload();
}

// ---------------- ENGINE ----------------
function buildRunningBalance(data) {

  const daysInMonth = new Date(
    now().getFullYear(),
    now().getMonth()+1,
    0
  ).getDate();

  let balance = data.budget;
  const map = {};

  for (let d = 1; d <= daysInMonth; d++) {

    const spent = data.history
      .filter(h => h.day === d)
      .reduce((s,h)=>s+h.amount,0);

    balance -= spent;

    map[d] = balance;
  }

  return map;
}

// ---------------- PANEL ----------------
function updatePanel(data, map) {

  const today = now().getDate();
  const balance = map[today] ?? data.budget;

  document.body.style.background =
    balance >= 0 ? "#1f8f4a" : "#c0392b";

  document.getElementById("safeText").innerHTML =
    balance >= 0
      ? `£${balance.toFixed(2)} remaining`
      : `£${Math.abs(balance).toFixed(2)} over`;

  document.getElementById("breakdownText").innerHTML =
    `Budget: £${data.budget || 0}`;
}

// ---------------- CALENDAR ----------------
function renderCalendar(data, map) {

  const el = document.getElementById("calendar");
  el.innerHTML = "";

  const d = now();
  const today = d.getDate();

  const monthName = d.toLocaleString('default', { month: 'long' });
  const year = d.getFullYear();

  document.getElementById("calendarHeader").innerText =
    `${monthName} ${year}`;

  const daysInMonth = new Date(year, d.getMonth()+1, 0).getDate();

  for (let i = 1; i <= daysInMonth; i++) {

    let cls = "day";

    const bal = map[i];

    if (i > today) cls += " future";
    else cls += bal >= 0 ? " green" : " red";

    const div = document.createElement("div");
    div.className = cls;

    div.innerText = `${i}\n£${(bal ?? 0).toFixed(0)}`;

    div.onclick = () => {
      selectedDay = i;

      document.getElementById("selectedDayBox").innerHTML =
        `<b>Day ${i}</b><br>Balance: £${(bal ?? 0).toFixed(2)}`;

      updateUI();
    };

    el.appendChild(div);
  }
}

// ---------------- MAIN ----------------
function updateUI() {

  const data = getData();
  const map = buildRunningBalance(data);

  updatePanel(data, map);
  renderCalendar(data, map);
}

updateUI();

</script>

</body>
</html>
