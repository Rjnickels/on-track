<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stay Green</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    transition: background 0.3s ease;
    color: white;
    display: flex;
    justify-content: center;
    padding: 20px;
    min-height: 100vh;
  }

  .container {
    width: 100%;
    max-width: 560px;
    text-align: center;
  }

  .inputWrap {
    position: relative;
    margin: 6px 0;
  }

  .currency {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0.6;
    color: black;
    font-weight: bold;
  }

  input {
    width: 100%;
    padding: 12px 12px 12px 28px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
  }

  button {
    width: 100%;
    padding: 12px;
    margin: 6px 0;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    background: white;
    color: black;
    font-weight: bold;
    cursor: pointer;
  }

  .tabs {
    display: flex;
    gap: 6px;
    margin: 10px 0;
  }

  .tabs button {
    flex: 1;
    background: rgba(255,255,255,0.2);
    color: white;
  }

  .tabs button.active {
    background: white;
    color: black;
  }

  .panel {
    background: rgba(255,255,255,0.12);
    padding: 14px;
    border-radius: 10px;
    margin: 10px 0;
  }

  .big { font-size: 22px; font-weight: bold; }
  .sub { font-size: 14px; opacity: 0.9; }

  .error {
    color: #ff4d4d;
    font-size: 14px;
  }

  .calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-top: 10px;
  }

  .day {
    padding: 10px 0;
    border-radius: 8px;
    font-size: 11px;
    white-space: pre-line;
    cursor: pointer;
  }

  .green { background:#1f8f4a; }
  .red { background:#c0392b; }
  .future { background:rgba(255,255,255,0.35); color:black; }
</style>
</head>

<body>

<div class="container">
  <h1>Stay Green</h1>

  <div class="inputWrap">
    <span class="currency">£</span>
    <input id="budget" type="number" placeholder="Monthly budget"/>
  </div>

  <div class="inputWrap">
    <span class="currency">£</span>
    <input id="spend" type="number" placeholder="Spend"/>
  </div>

  <div id="error"></div>

  <button onclick="addSpend()">Add Spend</button>

  <div class="tabs">
    <button onclick="setView('day')" id="dayBtn" class="active">Day</button>
    <button onclick="setView('week')" id="weekBtn">Week</button>
    <button onclick="setView('month')" id="monthBtn">Month</button>
  </div>

  <div class="panel">
    <div class="big" id="mainValue">—</div>
    <div class="sub" id="subValue">—</div>
  </div>

  <div class="calendar" id="calendar"></div>
</div>

<script>

let view = "day";
let selectedDay = null;

function now(){ return new Date(); }

function key(){
  const d = now();
  return `${d.getFullYear()}-${d.getMonth()}`;
}

function getData(){
  return JSON.parse(localStorage.getItem(key())) || {budget:0,history:[]};
}

function save(d){
  localStorage.setItem(key(), JSON.stringify(d));
}

// ---------------- INPUT ----------------
document.getElementById("budget").addEventListener("input",(e)=>{
  const d=getData();
  d.budget=parseFloat(e.target.value)||0;
  save(d);
  render();
});

// ---------------- VIEW ----------------
function setView(v){
  view=v;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
  document.getElementById(v+"Btn").classList.add("active");
  render();
}

// ---------------- ENGINE ----------------
function build(){
  const d=getData();
  const days=new Date(now().getFullYear(),now().getMonth()+1,0).getDate();

  let bal=d.budget;
  const map={};

  for(let i=1;i<=days;i++){
    const spent=d.history.filter(h=>h.day===i).reduce((s,h)=>s+h.amount,0);
    bal-=spent;
    map[i]=bal;
  }

  return map;
}

// ---------------- VIEW LOGIC (FIXED PROPERLY) ----------------
function viewValue(balance){

  const d=getData();
  const daysLeft=new Date(now().getFullYear(),now().getMonth()+1,0).getDate()-now().getDate()+1;

  if(view==="day") return balance/daysLeft;
  if(view==="week") return balance/Math.max(1,Math.ceil(daysLeft/7));
  return balance;
}

// ---------------- MAIN ----------------
function render(){

  const d=getData();
  const map=build();
  const today=now().getDate();

  const balance=map[today];

  document.body.style.background=balance>=0?"#1f8f4a":"#c0392b";

  const display=viewValue(balance);

  document.getElementById("mainValue").innerText=
    (display>=0?`£${display.toFixed(2)}`:`-£${Math.abs(display).toFixed(2)}`)+" ("+view+")";

  document.getElementById("subValue").innerText=
    "Remaining: £"+balance.toFixed(2);

  const cal=document.getElementById("calendar");
  cal.innerHTML="";

  const days=new Date(now().getFullYear(),now().getMonth()+1,0).getDate();

  for(let i=1;i<=days;i++){

    const b=map[i];

    const div=document.createElement("div");

    let cls="day";
    if(i>today) cls+=" future";
    else cls+=(b>=0?" green":" red");

    div.className=cls;

    div.innerText=i+"\n£"+b.toFixed(0);

    cal.appendChild(div);
  }
}

render();

</script>

</body>
</html>
